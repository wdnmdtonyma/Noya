<script>
(function () {
  var trigger = document.getElementById('bookSwitcherTrigger');
  var menu = document.getElementById('bookSwitcherMenu');
  var newBookAction = menu.querySelector('[data-component="new-book-action"]');
  function currentWorkspacePath() {
    return window.location.pathname + window.location.search;
  }
  function rememberWorkspace() {
    try { localStorage.setItem('noya:last-workspace', currentWorkspacePath()); } catch (error) {}
  }
  function syncNewBookAction() {
    var returnTarget = currentWorkspacePath();
    newBookAction.href = '/p/00-open-book?new=1&return=' + encodeURIComponent(returnTarget);
  }
  rememberWorkspace();
  syncNewBookAction();
  newBookAction.addEventListener('pointerenter', syncNewBookAction);
  newBookAction.addEventListener('focus', syncNewBookAction);
  newBookAction.addEventListener('click', function () {
    var returnTarget = currentWorkspacePath();
    try { localStorage.setItem('noya:last-workspace', returnTarget); } catch (error) {}
    syncNewBookAction();
  });
  function closeSwitcher() {
    menu.hidden = true;
    trigger.setAttribute('aria-expanded', 'false');
  }
  trigger.addEventListener('click', function () {
    var willOpen = menu.hidden;
    menu.hidden = !willOpen;
    trigger.setAttribute('aria-expanded', String(willOpen));
  });
  document.addEventListener('click', function (event) {
    if (!event.target.closest('.noya-book-switcher')) closeSwitcher();
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') closeSwitcher();
  });
})();
</script>
