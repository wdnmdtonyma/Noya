<!-- sandbox -->
<!-- title: 作品概览 -->
<!-- manifest
state: activeBook
components: book-switcher, book-navigation, book-overview, continue-writing
-->
<style>
  .bd-shell {
    height: 100vh;
    display: grid;
    grid-template-columns: 236px minmax(0, 1fr);
    overflow: hidden;
    background: var(--color-bg);
  }
  .bd-side {
    min-width: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid var(--color-border);
    background: var(--color-surface);
  }
  .bd-nav {
    flex: 1; min-height: 0; overflow: hidden;
    display: flex; flex-direction: column;
    padding: 8px 9px 12px;
  }
  .bd-nav__fixed { flex: 0 0 auto; }
  .bd-nav__chapters { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .bd-nav__chapter-scroll { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 8px; }
  .bd-nav__group {
    margin: 12px 9px 5px;
    color: var(--color-text-muted);
    font-size: var(--font-size-xs);
    letter-spacing: .08em;
  }
  .bd-nav__link {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 34px;
    padding: 0 9px;
    border-radius: var(--radius-md);
    color: var(--color-text-secondary);
    font-size: var(--font-size-sm);
    text-decoration: none;
    transition: color var(--dur-fast), background var(--dur-fast);
  }
  .bd-nav__link:hover { color: var(--color-text); background: var(--color-surface-sunken); }
  .bd-nav__new {
    display: flex;
    align-items: center;
    gap: 7px;
    width: 100%;
    min-height: 34px;
    margin-bottom: 2px;
    padding: 0 9px;
    border: 1px dashed var(--color-border-strong);
    border-radius: var(--radius-md);
    color: var(--color-text-muted);
    font-size: var(--font-size-sm);
    text-decoration: none;
    transition: color var(--dur-fast), border-color var(--dur-fast), background var(--dur-fast);
  }
  .bd-nav__new:hover { color: var(--color-primary); border-color: var(--color-primary); background: var(--color-primary-soft); }
  .bd-nav__muted { min-height: 32px; padding: 7px 9px; color: var(--color-text-muted); font-size: var(--font-size-xs); }
  .bd-main {
    min-width: 0;
    overflow-y: auto;
    background:
      radial-gradient(circle at 48% -18%, var(--color-surface-raised) 0, transparent 39%),
      var(--color-bg);
  }
  .bd-page {
    width: min(820px, calc(100% - 72px));
    margin: 0 auto;
    padding: 72px 0 96px;
  }
  .bd-overview { view-transition-name: bd-overview; }
  .bd-kicker {
    margin-bottom: 14px;
    color: var(--color-primary);
    font-size: var(--font-size-xs);
    font-weight: 680;
    letter-spacing: .12em;
  }
  .bd-title {
    max-width: 720px;
    margin: 0;
    color: var(--color-text);
    font-family: var(--font-prose);
    font-size: clamp(32px, 4.6vw, 48px);
    font-weight: 590;
    line-height: 1.24;
    letter-spacing: .01em;
  }
  .bd-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    margin-top: 15px;
    color: var(--color-text-muted);
    font-size: var(--font-size-sm);
  }
  .bd-meta span + span { position: relative; }
  .bd-meta span + span::before {
    content: '';
    position: absolute;
    top: 50%;
    left: -9px;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: var(--color-border-strong);
  }
  .bd-description {
    max-width: 690px;
    margin: 30px 0 0;
    color: var(--color-text-secondary);
    font-family: var(--font-prose);
    font-size: 18px;
    line-height: 1.95;
  }
  .bd-rule { height: 1px; margin: 42px 0 28px; background: var(--color-border); }
  .bd-resume {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 28px;
    align-items: center;
    min-height: 176px;
    padding: 27px 29px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-xl, 16px);
    background: var(--color-surface-raised);
    box-shadow: var(--shadow-sm);
  }
  .bd-resume__label {
    margin-bottom: 9px;
    color: var(--color-text-muted);
    font-size: var(--font-size-xs);
    letter-spacing: .08em;
  }
  .bd-resume h2 {
    margin: 0;
    font-family: var(--font-prose);
    font-size: var(--font-size-xl);
    font-weight: 640;
  }
  .bd-resume__excerpt {
    display: -webkit-box;
    max-width: 570px;
    margin: 12px 0 0;
    overflow: hidden;
    color: var(--color-text-secondary);
    font-family: var(--font-prose);
    font-size: var(--font-size-md);
    line-height: 1.85;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }
  .bd-resume__go {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-width: 102px;
    min-height: 40px;
    padding: 0 16px;
    border-radius: var(--radius-md);
    background: var(--color-primary);
    color: var(--color-surface-raised);
    font-size: var(--font-size-md);
    font-weight: 650;
    text-decoration: none;
    transition: background var(--dur-fast), transform var(--dur-fast), box-shadow var(--dur-fast);
  }
  .bd-resume__go:hover { background: var(--color-primary-hover); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  .bd-latest {
    display: grid;
    grid-template-columns: 105px minmax(0, 1fr);
    gap: 20px;
    margin-top: 24px;
    padding: 0 4px;
    color: var(--color-text-secondary);
    font-size: var(--font-size-sm);
    line-height: 1.8;
  }
  .bd-latest__label { color: var(--color-text-muted); }

  @media (max-width: 820px) {
    .bd-shell { grid-template-columns: 210px minmax(0, 1fr); }
    .bd-page { width: min(100% - 38px, 820px); padding-top: 48px; }
    .bd-resume { grid-template-columns: 1fr; gap: 20px; }
    .bd-resume__go { justify-self: start; }
  }
</style>

<div class="bd-shell">
  <aside class="bd-side noya-product-sidebar" data-component="book-navigation">
    <div class="noya-book-switcher" data-component="book-switcher">
      <button class="noya-book-switcher__trigger" id="bookSwitcherTrigger" aria-expanded="false" aria-controls="bookSwitcherMenu">
        <span class="noya-book-switcher__mark">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2.2h7.2A1.8 1.8 0 0 1 12 4v8.3H4.1A1.6 1.6 0 0 1 2.5 10.7V3.2A1 1 0 0 1 3.5 2.2Z"/><path d="M4.1 9.2H12M5 5.1h4.4"/></svg>
        </span>
        <span class="noya-book-switcher__copy">
          <span class="noya-book-switcher__title" id="switcherTitle"></span>
          <span class="noya-book-switcher__meta" id="switcherMeta"></span>
        </span>
        <svg class="noya-book-switcher__chevron" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"><path d="m4 5.5 3 3 3-3"/></svg>
      </button>
      <div class="noya-book-switcher__menu" id="bookSwitcherMenu" hidden>
        <a class="noya-book-switcher__item" href="/p/00-open-book?new=1" data-component="new-book-action">
          <span class="noya-book-switcher__item-copy">开始一本新书</span>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"><path d="M7 2.5v9M2.5 7h9"/></svg>
        </a>
        <div class="noya-book-switcher__divider"></div>
        <a class="noya-book-switcher__item" data-switch-book="qingyun" href="/p/04-d-three-column?book=qingyun"><span class="noya-book-switcher__item-copy">我在青云宗打卡修仙</span><span class="noya-book-switcher__item-note"></span></a>
        <a class="noya-book-switcher__item" data-switch-book="zhongkui" href="/p/04-d-three-column?book=zhongkui&amp;section=chapter"><span class="noya-book-switcher__item-copy">未命名 · 钟馗弟子</span><span class="noya-book-switcher__item-note"></span></a>
        <a class="noya-book-switcher__item" data-switch-book="fogharbor" href="/p/04-d-three-column?book=fogharbor&amp;section=chapter"><span class="noya-book-switcher__item-copy">雾港没有月亮</span><span class="noya-book-switcher__item-note"></span></a>
      </div>
    </div>
    <div class="noya-side-rule"></div>
    <nav class="bd-nav" id="bookNavigation" aria-label="书内导航"></nav>
  </aside>

  <main class="bd-main">
    <article class="bd-page bd-overview" data-component="book-overview">
      <div class="bd-kicker">作品概览</div>
      <h1 class="bd-title" id="bookTitle"></h1>
      <div class="bd-meta"><span id="bookLength"></span><span id="bookStatus"></span><span id="bookUpdated"></span></div>
      <p class="bd-description" id="bookDescription"></p>
      <div class="bd-rule"></div>
      <section class="bd-resume" data-component="continue-writing">
        <div>
          <div class="bd-resume__label">上次写到</div>
          <h2 id="resumeTitle"></h2>
          <p class="bd-resume__excerpt" id="resumeExcerpt"></p>
        </div>
        <a class="bd-resume__go" id="resumeLink" href="/p/04-d-three-column">
          继续写
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7h8.5M8 4l3 3-3 3"/></svg>
        </a>
      </section>
      <div class="bd-latest"><span class="bd-latest__label">眼前这一步</span><span id="nextStep"></span></div>
    </article>
  </main>
</div>

<script>
(function () {
  var RESOURCES = [
    ['outline', '大纲'], ['world', '世界志'], ['threads', '伏线'],
    ['people', '人物志'], ['library', '资料库'], ['style', '笔法']
  ];
  var BOOKS = {
    qingyun: {
      title: '我在青云宗打卡修仙', switcherMeta: '第 13 章正在写', length: '3.6 万字 · 13 章', status: '连载中', updated: '今天刚写过',
      previousChapters: '…… 第 1–12 章',
      description: '林凡从青云宗杂役院起步，在一次次签到与冲突中，逐渐触到这座宗门不愿让外门弟子知道的旧事。',
      resumeTitle: '第 13 章 · 藏经阁的老头',
      resumeExcerpt: '清晨，杂役院。孙彪带三个人堵住林凡，话还没说完，藏经阁方向忽然传来一声只有他听见的铜铃。',
      nextStep: '把韩拾遗第一次注意到林凡的方式定下来，然后完成这一章。',
      resumeHref: '/p/04-d-three-column?book=qingyun'
    },
    zhongkui: {
      title: '未命名 · 钟馗弟子', switcherMeta: '第一章正在写', length: '1,246 字 · 1 章', status: '刚开始', updated: '今天刚写过',
      previousChapters: '',
      description: '一个无法越过奈何桥的人，随钟馗修行，替世间游魂解开执念，也一步步走回自己最不敢面对的那场火。',
      resumeTitle: '第一章 · 纸船入城',
      resumeExcerpt: '纸船冲进巷口的那一刻，青年先一刀砍断了自己的影子。刀锋落地，没有血，青石板上的黑影却猛地一缩。',
      nextStep: '继续第一场交锋，让力量的边界和纸船真正想带走的东西同时露出来。',
      resumeHref: '/p/04-d-three-column?book=zhongkui&section=chapter'
    },
    fogharbor: {
      title: '雾港没有月亮', switcherMeta: '第 29 章正在写', length: '8.1 万字 · 29 章', status: '连载中', updated: '昨天写过',
      previousChapters: '…… 第 1–28 章',
      description: '领航员沈砚追查一场从未发生过的海难。潮声每错一次，雾港就会多出一段不属于任何人的记忆。',
      resumeTitle: '第 29 章 · 潮声背后',
      resumeExcerpt: '第三遍潮声响起时，港口所有系船的绳结同时松了半寸。沈砚站在废灯塔下，等门缝里的灯再亮一次。',
      nextStep: '决定门后叫出真名的人是否真的认识沈砚，再进入灯塔。',
      resumeHref: '/p/04-d-three-column?book=fogharbor&section=chapter'
    }
  };
  function workspaceHref(bookKey, section) {
    if (bookKey === 'qingyun') {
      var qingyunOpen = { outline: 'outline', world: 'world', threads: 'tasks', people: 'people', library: 'library', style: 'style' };
      if (section === 'chapter') return '/p/04-d-three-column';
      if (section === 'new') return '/p/04-d-three-column?open=new';
      return '/p/04-d-three-column?open=' + qingyunOpen[section];
    }
    return '/p/04-d-three-column?book=' + encodeURIComponent(bookKey) + '&section=' + encodeURIComponent(section);
  }
  var requested = new URLSearchParams(window.location.search).get('book');
  var activeBook = BOOKS[requested] ? requested : 'qingyun';
  var book = BOOKS[activeBook];
  document.title = book.title + ' · 作品概览';
  document.getElementById('switcherTitle').textContent = book.title;
  document.getElementById('switcherMeta').textContent = book.switcherMeta;
  document.getElementById('bookTitle').textContent = book.title;
  document.getElementById('bookLength').textContent = book.length;
  document.getElementById('bookStatus').textContent = book.status;
  document.getElementById('bookUpdated').textContent = book.updated;
  document.getElementById('bookDescription').textContent = book.description;
  document.getElementById('resumeTitle').textContent = book.resumeTitle;
  document.getElementById('resumeExcerpt').textContent = book.resumeExcerpt;
  document.getElementById('resumeLink').href = book.resumeHref;
  document.getElementById('nextStep').textContent = book.nextStep;
  document.querySelectorAll('[data-switch-book]').forEach(function (link) {
    var isCurrent = link.dataset.switchBook === activeBook;
    link.classList.toggle('is-current', isCurrent);
    link.querySelector('.noya-book-switcher__item-note').textContent = isCurrent ? '当前' : '';
  });
  document.getElementById('bookNavigation').innerHTML =
    '<div class="bd-nav__fixed">' +
      '<a class="bd-nav__new" href="' + workspaceHref(activeBook, 'new') + '"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M6 2.5v7M2.5 6h7"/></svg>新建章节</a>' +
      '<div class="bd-nav__group">资料</div>' +
      RESOURCES.map(function (section) { return '<a class="bd-nav__link" href="' + workspaceHref(activeBook, section[0]) + '">' + section[1] + '</a>'; }).join('') +
    '</div>' +
    '<div class="bd-nav__chapters"><div class="bd-nav__group">正文</div><div class="bd-nav__chapter-scroll">' +
      (book.previousChapters ? '<div class="bd-nav__muted">' + book.previousChapters + '</div>' : '') +
      '<a class="bd-nav__link" href="' + workspaceHref(activeBook, 'chapter') + '">' + book.resumeTitle + '</a>' +
    '</div></div>';

  var trigger = document.getElementById('bookSwitcherTrigger');
  var menu = document.getElementById('bookSwitcherMenu');
  function closeSwitcher() { menu.hidden = true; trigger.setAttribute('aria-expanded', 'false'); }
  trigger.addEventListener('click', function () {
    var willOpen = menu.hidden;
    menu.hidden = !willOpen;
    trigger.setAttribute('aria-expanded', String(willOpen));
  });
  document.addEventListener('click', function (event) { if (!event.target.closest('.noya-book-switcher')) closeSwitcher(); });
  document.addEventListener('keydown', function (event) { if (event.key === 'Escape') closeSwitcher(); });
})();
</script>
