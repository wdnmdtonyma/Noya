feature: 小说 Agent 工具 · MVP
slug: noya-mvp
created: 2026-07-31
updated: 2026-08-11

status: review
stage: 3
complexity: standard
review_mode: multi
design_posture: restructure

journey_summary: |
  产品入口按作者是否已有作品分流：没有作品时直接进入开书；已有作品时直接回到上次那本书、上次停留的写作位置。
  “开始一本新书”位于书名目录的第一项，和已有作品之间用分隔线区分。开书过程中每一步自动保存；中断后再回来，
    先继续未完成的故事，也可以明确重新开始。从已有作品进入开书流程时，全程保留返回刚才作品的入口；返回恢复原来的写作位置，开书草稿继续保存。
    点击“正式写第一章”后，开书草稿转化为新作品正文、资料与 Agent context，不再作为未完成草稿出现；试写与讨论过程保留为该作品的创作历史，MVP 不额外铺设维护入口。
  首次开书：作者先用文字或语音自由讲述一个画面、人物、快感、机制或结局 → Agent 复述自己听见的内容并每轮只追问一个关键问题
    → 在第一次试写前确认这次更优先“像心里的故事”还是“让陌生读者追下去” → 写 500—900 字的同场景短试写
    → 作者自然反馈，必要时补一小段参考文字 → Agent 汇总不同读者视角的审查意见后重写同一场景
    → 作者确认方向，系统只用一句轻量摘要说明哪些已确定、哪些仍在试、哪些保持留白 → 已确认的试写直接成为可继续写和修改的第一章初稿开头，不再从头生成重复正文，也不经过作品概览。
  日常主线：作者打开 Noya → 系统恢复上次作品与上次写作位置 → 按当前任务从书中组装 context
    → 作者排章 → 点击“按这个写”进入初稿 → 直接编辑或选段让 Agent 修改 → 点击“定稿”
    → 正文与相关资料作为一次完整更新生效 → 明确进入下一章
    → 下一次工作重新从书中取材，不依赖跨对象聊天记录。
  恢复规则：上次写作位置指最后一个未完成的创作任务，不是字面上的最后访问页面。存在未完成的排章、写章、改稿或 Agent 任务时回到该任务；
    没有未完成任务时回到当前正在写的章节。查看人物志、世界志等资料不会改变下次启动位置；资料页各自记住浏览位置，作者再次主动进入时再恢复。
    同一本书同一时刻只保留一个未完成的创作任务；新建章节不能绕过仍在安排、写作、修改或定稿的当前章。
  作品切换：书内持续显示当前书名，作者点击书名展开轻量书籍目录；第一项是“开始一本新书”，其后才是已有作品，不混入作品概览。
    选择另一部作品后，系统在同一套书内工作台恢复那本书自己的上次写作位置，不先经过作品列表，也不更换页面骨架。
  MVP 不设置独立的“我的作品”首页；轻量书籍目录同时承担新建作品和切换已有作品，避免在继续写作之前再增加一层作品目录。
  书内空间：左侧导航只服务当前作品；正文、大纲、世界志、伏线、人物志、资料库和笔法在同一空间内切换，不反复退出作品。
    导航从上到下固定为新建章节、资料、正文；资料入口不随章节增长移动。MVP 先平铺全部章节，不折叠、不合并，正文列表在剩余高度内独立滚动。
    三本书不只共用外层三栏：同一类资料也共用同一种详情结构与操作。切书时只替换这本书的内容，不把大纲、世界志、伏线、人物志、资料库或笔法退回通用文档页。
  Context 已定稿：
    - 一本书一个本地文件夹；正文、大纲、世界志、人物志、资料库、伏线和笔法共同构成长期 context。
    - 一件工作一条执行记录，并挂在对应章节或资料上；旧记录只供查看，不进入新任务 context。排章和写作分开，
      本章安排是两次工作之间唯一的传递内容。
    - 本章安排只写高层故事事件；确实需要细节时使用“标题 + 描述”，不在排章阶段提前代写正文。
    - 采用作者中心的自适应三栏：中间正文始终是主舞台，右侧是可伸缩的 Agent 执行轨。空闲时保持克制，任务开始后展开当前工作的完整过程，作者仍可随时收起。
    - Agent 执行轨按一件工作组织，依次展示作者要求、查找、阅读、工具与生成、检查、等待决定和完成结果；每一步区分等待、进行中、完成、失败、停止和等待作者决定。
      等待作者决定时，同一任务停在原步骤；即使执行轨收起、切资料或切作品，Agent 入口仍显示待处理数量，作者回应后从原步骤继续。
      默认显示人能判断进展的摘要，展开后可看查询、命中结果、工具结果和改动差异；不显示隐藏推理、原始 context 拼装、内部任务名、调试日志或猜你想问。
    - 写章读取近期正文、早期摘要、最近的大纲锚点、主要人物、相关伏线、地点链、运行规则、相关资料和笔法范例。
    - Agent 能提前看出的关键人物、关键道具、新势力和新伏线，要在动笔前让作者决定；作者接受包含它们的章节后，
      定稿时随正文一起同步，不再重复确认。
    - 作者平时留在正文，发现问题时才查看、编辑、让 Agent 修改或从历史回退。章节与资料标题附近都能打开自身历史，先看差异与关联内容，再预检和整体回退。
  当前收口：先完成新建与恢复、任务边界、章节阶段、明确下一步、正文编辑与撤销、原子定稿、任务恢复、旧章影响预检和按章时点取材。
    已定稿章节可按故事顺序导出为一个 TXT；导入已有长篇、版本分叉对比、卷级折叠、完结发布和多人协作后置。

# 阶段一拍板（2026-07-31）
# 从 noya-ideal（已归档，复杂度过高）收缩而来。继承的定位：自用单人 / 人当导演 Agent 当写手 /
# 只到成稿不管发布 / 防跑偏是核心价值。形态变了：从"世界沙盒（满屏会长的地图 + 唯一一个输入框）"
# 退回"工具形态（有导航、有列表、有页面，agent 是里面的助手而非唯一的门）"。
stage_one_decisions: |
  实现骨架：一本小说 = 本地一个文件夹。世界观／大纲／人物／资料条目／主线／支线／明线／暗线各是一份纯文本
  文件，章节正文也是文件；版本管理留全历史。git 术语不露给用户，露出来的是能力——每次改动有历史、
  能看清改了什么、能退回去、能试一个别的版本。文件可以用任何编辑器直接改，agent 下次读到。
  持久 context：世界志/大纲/人物志/资料库/伏线/笔法是 agent 写作时读取的文件。agent 负责随正文自动同步和整理，
  不把日常维护转嫁给作者；用户必要时可以直接编辑，或让 agent 修改。进度、登场角色、没还的伏笔是从正文
  里自动读出来的派生内容。正常使用时，作者的注意力应该留在正文，设定页只在查看、纠错或回退时进入。

  写作节奏：两种都要，默认一章一拍；熟了之后可切"给一段目标连着写完"。
  开书起点：跟 agent 聊出来——用户可以从画面、人物、快感、机制、结局或世界中的任何一个入口开始；
    不先填问卷，也不一次生成全套设定文件。Agent 每轮只追问一个会改变故事的问题，尽快用同一个场景短试写校准。
    明确不做选题雷达／书种／市场推荐那一套。
  自由发挥边界：分大小。路人、小地名、一次性的东西 agent 随便造，写完告知；长期角色、关键道具、
    新势力、新伏笔这类会拖很久的，动笔前先亮出来问一句。
  文风起底：用户贴一段范文、使用自己的旧稿，或从已经定稿的章节里选出写对的片段；agent 提炼成笔法文档并保留少量正文范例。
    之后在具体章节上指着改，长期偏好继续沉淀进笔法，局部修改只留在当前章节。改笔法只影响往后的章，历史章不动、可单独重润。
  版本范围（做到哪儿算完）：到能稳定日更为止——开书 + 设定管理页 + 连续写章不漂移 + 改稿回退。
    一天六千字上下、两三章、坐一小时能出来且不用回头修矛盾。
  明确不做：选题与市场推荐 / 游戏化界面表达（地图·迷雾·棋子·通关结算）/ 完结收尾那一段（盘伏笔·
    写收尾方案）/ 发布与平台数据 / 多人协作与分享 / 复杂的书架管理。支持新建与切换作品，但每本书仍是一个独立本地文件夹。
    导出只做最简单的：章节拼成一个 txt。

  【2026-08-01 用户纠正 · 承重决策】对话不是连续的，是一件事一条。
  用户："如果右边是连续的对话，那么 context 就全乱了，你得从技术实现的视角来看这个问题。"
  连续对话＝context 靠积累（聊天记录里躺着前几章全文、已否掉的方案），与"context 靠组装"直接打架，
  且已否方案会一直污染后续生成，防漂移失效。正确模型：每件事一次干净的组装，context 来自仓库不来自聊天。
  三条后果：
  ① 一件工作一条执行记录，并挂在对应对象上——第 13 章的一次排写是一条，之后再改第 13 章会新开一条；左栏切对象时右栏跟着切到
     该对象当前的工作。每轮读哪些材料由 agent 内部组装，不在前台展示作用域、读取路径或 context 选择器。
  ② 对话临时、文件持久——凡是要长期生效的话，agent 必须当场落成文件改动。右侧用连续工作信息流显示处理顺序与“已更新”的结果，
     不做聊天气泡，不暴露“落盘”等实现术语。
  ③ “本章安排”是"排"和"写"之间唯一的传递物——两趟 context 不同，排的时候说的话要在写的时候算数，
     只能靠进入本章安排；写正文那趟只读本章安排，不读排章对话。本章安排必须可逐条改，但只写高层故事事件；
     确实需要细节时使用“标题 + 描述”，不能在排章阶段提前代写正文。

  【2026-08-01 逐模块讨论 · 已过的几条】
  · 命名：世界志 / 大纲 / 伏线 / 人物志 / 资料库 / 笔法 / 正文（七项）。原「脉络」「纲目」砍掉。
  · 世界志的判定轴不是"会不会进展"（错的，世界大事也在进展），是"约束还是待兑现"：
    章节不能跳出它的进世界志（含缓慢变化的世界大事）；埋下去读者等着兑现的进伏线。
    世界志本身是一棵有父子关系的世界树，不按读取时机拆成五堆平铺条目。写一章时从树上取地点路径，
    再补这一章实际用到的修行、社会、经济和主角机制节点；context 按路径组装，不靠 tab 碰运气。
  · 人物志 v3（2026-08-02，关系树 + Markdown 人物文档）：
    ①人物志是世界志的微观形态：一个人也是一套法则，约束他自己的行为。关系树自上而下展开：当前人物居中在最上层，竖向主线
      接入一条横向分叉线，再垂直落到亲缘、亲近、敌对、后辈、未定等分支；下一层用同样结构按家族或势力聚合，最后落到具体人物。
      每个聚合节点显示人数并能独立展开、收起。
    ②单击具体人物只切换下方档案，关系树中心和路径都不变；双击人物才把他设为新的关系树中心，并把原来的中心保留在视图路径中。
      人物志顶部显示「人物志 / 林凡 / 韩拾遗」式面包屑。用户可以返回上一个视图、点击面包屑中的任一上级视图，或一键回到主角视图；
      回到主角时清空临时路径。
    ③从左栏直接进入人物志时默认看主角；从正文、伏线或其他人物点进来时，直接打开被点到的那个人，不要求用户回列表再找。
    ④每个人物只有一份自由的 Markdown 文档。标题、段落和列表按这个人物已有的内容自然组织，不设置身份、动机、能力、随身、钱财、
      写作特征等必填栏。关系树回答“他和谁有关”，文档直接说明“写这个人时要记住什么”。
    ⑤文档长短跟着剧情走。主角已经明确的修为、技能、物品和钱财会自然写进人物小传；信息少的配角可以只有两三段，不用“尚未写明”
      或空模块把页面补齐。会反复出现且自身有稳定规则的能力或物品只在人物文档里写人与它的关系，完整说明放进资料库并互相引用。
    ⑥Agent 把人物文档当作创作 context 整体读取和更新。它可以为了可读性整理 Markdown，但不能为了统一格式补字段、扩写未知信息，
      更不能让固定模板反过来驱动人物和剧情。
  · 资料库 v1（2026-08-02）：
    ①资料库收会被多处反复提及、且自身有稳定规则的命名对象：功法、术法、技能、丹药、材料、道具和关键物品。人物、地点和世界通用规则
      仍分别留在人物志与世界志；只出现一次、没有独立规则的普通物件不单独建档。
    ②每个条目是一份自由 Markdown 文档。标题、段落和列表跟着已有信息自然生长，不要求用途、来源、限制、持有人等固定字段齐全；未知内容
      保持未知，不能为了把模板填满而发明设定。样书首批只收《引气诀》和父亲留下的玉。
    ③人物志说明某个人会不会、持不持有、当前用到什么程度；资料条目说明这件东西本身是什么、能做什么、不能做什么；世界志说明所有人都受
      哪些通用规则约束；伏线说明尚未兑现的真相和安排。同一个对象可以和伏线互引，但不把未揭开的真相提前写成已经成立的事实。
    ④正文、人物志、世界志或伏线提到条目时，用虚线下划线连接。悬停直接看一两句简介，点击进入条目；条目底部列出提到它的人物和世界内容，
      可以原路跳回。页面不显示引用计数、读取路径或其他调试信息。
    ⑤Agent 在已出现的命名对象会继续复用或带有写作约束时自动建档、随正文更新，不要求作者逐条确认资料归档。写某一章时只取和这一章直接相关的
      条目进入 context，不把整个资料库全塞进去。作者发现归错或写错时，直接编辑、让 agent 修改或从历史回退。
  · 笔法 v5（2026-08-02，作品内核 + 自然生长的笔法 + 精选范例）：
    ①笔法先回答“这本书相信什么”，再谈怎么写。样书的内核是：一个被踩在最底层的人，一点点把自己的命从别人手里拿回来；天地越大，
      他越渺小，而他每一次不肯低头也因此更有分量。人物升级不只意味着境界上涨，也意味着多拿回一点决定自己命运的权力。
    ②整本书的内核保持稳定，主角眼下的处境与故事气息直接写进同一篇笔法。样书从杂役院的低处和窄处开始，青云宗的广大只在必要时从日常里裂开；
      眼下的胜利不是天下无敌，而是林凡从只能忍走到有资格说“不”。他拿回的选择越多，文字可以越抬越高，但不能忘记他最早站在哪里。
    ③景别和节奏随场面变化，但都服务同一个内核。日常贴近身体和手边小物；冲突收紧距离，让每个动作改变处境；宗门、战争和天地异象先展开空间、
      数量、秩序与众人反应，再落回主角具体的身体和选择。宏大不能靠堆夸张词，短句也不是整本书唯一的腔调。
    ④页面是一篇连续的自由 Markdown 文档，不把长期内核、故事阶段、句式、心理或对话拆成需要作者维护的栏目。句子、视角、心理、对话和系统词属于
      实现手段，排在作品内核与场面尺度之后；规则不能反过来压扁本来需要舒展的场面。
    ⑤文档后保留 5—8 段精选范例并标明适用场景与来源。第一次遇到一种重要新场面时，agent 先给一段可以直接感受的短试写，作者照平常方式
      评价和修改；确认后的最终稿进入范例，但仍明确不算已经发生的剧情事实。被打回的版本只留在历史里。
    ⑥写某一章时读取整篇笔法、最近定稿正文，再按本章的景别和场面取 1—2 段最相关范例。写杂役院不取天地异象，写宗门大战不能只取
      短句近景；不把全部范例塞进去，也不能照搬范例中的人物、措辞和情节。
    ⑦用户明确说“以后都这样”时，agent 直接更新笔法并挑选最终稿作为范例；只说“这一段收短点”时只改当前章节。相同意见反复出现后，
      agent 可把它沉淀成笔法并告知作者。历史章节不自动重写，需要时由作者单独发起重润。
    ⑧故事进入新的阶段或一卷结束时，agent 根据大纲和已定稿正文改写笔法里与当前处境有关的段落，合并重复范例，把已经不合适的范例收进历史。
      作者看到的始终只是一篇笔法和少量范例；阶段判断与整理由 agent 完成，归错时仍可直接编辑、让 agent 修改或从历史回退。
  · 大纲 v4（2026-08-02，信息呈现定稿）：
    ①世界志决定什么事情在这个世界里成立；大纲承载作者已经决定的命运，所以权威很高。但权威来自作者明确写下的意图，
      不是来自字段齐全。作者只定了开头和结局时，只有这两处是约束，中间的空白不是一组等着 agent 补完的任务。
    ②前台是一篇按故事先后直接往下读的普通文稿，不画成图表式时间轴，也不拆成同构卡片或状态面板。已写摘要、当前意图和
      未来明确锚点各出现一次；当前段落只做轻微突出，未知中段只在正文之间自然留白，用省略号表示即可。
    ③每处内容不要求同一种形状：可以只有一句结果，也可以是一段自由笔记、一幅场景、几个人物关系，或已经写完的一段摘要。
      取消「每段都必须有起点 / 转折 / 落点 / 人物变化 / 必须发生」的前台和 agent 要求。内部可以为了检索做结构化整理，
      但不能反过来驱动创作；这不是标注，agent 必须先服务剧情，再考虑结构是否整齐。
    ④任意位置都可以写下一个已知画面、人物选择或结果；允许开头已写、卷一结尾已定、中间整段未知，也允许只写到眼前、
      后面什么都没有。留白不做说明卡，也不伪装成字段没填完的剧情任务。
    ⑤写下一章时，agent 读取最近的已写事实、当前意图和前方最近一个明确锚点。锚点只约束已经确定的结果，不替作者规定抵达路线；
      空白也不触发自动补全。用户要求一起想时，agent 才提一个可撤回的走法，没被接受就不落盘。
    ⑥支持边写边想，不设置必须先补大纲的模式门槛。前方没有锚点时就只服务眼前一章；有远处锚点时把它当方向而非模板。
      如果连续写作明显跑偏，agent 提醒一次；用户坚持后照写，不反复劝，也不阻断。
    ⑦每章定稿后，agent 仍自动把已经发生的事实同步回大纲；未来笔记保持可变。改动明确锚点时，才一起检查人物志里的欲望、
      伏线去向和世界志法则。普通作者 99% 的时间继续看正文，不需要维护大纲的完整度。
  · 伏线只管读者暂时看不见的线，形态是泳道不是清单——因为暗线是一条平行在跑的故事线，
    清单记不了"它在暗处推进到哪"和"前面埋了哪几处"。线上三种点：
    伏笔（写进正文了，读者看得见但不懂）/ 幕后（没写进正文，读者看不见，但约束后面怎么写）/ 揭开。
    点开任一点看那一处的正文原文＋它其实是什么。作者最难判断的"埋够了吗"＝揭开点往左数伏笔。
  · 伏线 v2（2026-08-01 用户三条纠正后重做）：
    ①事实与打算必须分开。原型曾把没写到的章画成实心点还能点开看"正文"——硬伤。
      横轴三段：已写的按章（事实，点开是真正文）｜在写的那一章（排在时间轴上、正文还没落，空心虚线）｜
      往后按剧情段（打算，会变）。
    ②不做"还剩多少章揭开"这类预测——剧情段会伸缩，章号不作数。打算挂在剧情段上（"打算在外门大比揭开"）。
    ③每条伏线要有"往后打算怎么走"：定了去向 / 还没想好（都可随时改，改了 agent 后面按新的走）。
      对应 agent 行为：定了去向→写到那个剧情段时往这儿收、在那之前不主动还；还没想好→隔一阵问一次、
      不自作主张；氛围→不提醒不催、也不许自作主张去还它。
    ④分量三档（用户："伏线太多了看着累，得埋得巧妙"）：重（揭开时读者对整本书的理解会变）/
      轻（爽一下收掉就完）/ 氛围（障眼法，不发展）。泳道默认只摆"重"的，别的收起。
      提醒口径从容量（"读者跟得住 5–7 条"）改成质量："想不出好去向的伏线，多半一开始就不该埋"，
      且只对"重"的提醒。原"弃了"状态砍掉——改主意不要了和本来就是障眼法，对 agent 是同一条指令。
    ⑤agent 提议埋伏笔的默认姿态：埋不埋得起才提议——说得出"在哪个剧情段爆"和"能有多响"才开口，
      只值"轻"的要先说明白让用户决定要不要占位置。
    ⑥待定：伏笔的另两条来源——用户自己写的正文里无意埋了东西（agent 读出来问"这算伏笔吗"）、
      写了很多章后回头发现某句话能当伏笔用（定稿后自动回看时发现）。用户尚未拍板做不做。

  · 世界志 v3（2026-08-01，最新反馈覆盖上一版结论）：
    ①世界志先是一棵树。空间固定按「界 → 大陆/海域 → 境域 → 势力/国家 → 机构 → 地点」往下挂。
      例：玄苍界 → 天南大陆 → 东境 → 青云宗 → 外门 → 杂役院 → 井台。渐进式披露靠展开层级，
      不是把有关信息拆散到不同 tab。
    ②格局与风土合回空间树：势力挂在它实际统辖的地域，风土挂在它发生的地点。东境共同气候住东境；
      青云宗山路住青云宗；井台材质住杂役院下面。谁描述谁，就归谁。
    ③「完整世界」的最低标准是当前写作范围能运转。世界树除了空间，还要有修行与自然、社会秩序、
      经济与资源、主角机制四根运行枝；能回答人住哪、谁管谁、靠什么修炼、钱值多少、主角凭什么破局。
      不要求开书写完整个大陆，但东境·青云宗这条当前舞台必须先闭环，未涉及的三境以留白节点明确封住。
    ④章节 context 从树上取两类东西：一条完整地点链 + 本章真正用到的运行规则。第 13 章读取
      玄苍界→天南大陆→东境→青云宗→外门→杂役院/藏经阁，再取道源/境界、铜钱/藏经阁价格、
      签到触发/限制/当前进度。这段组装是 agent 内部行为，世界志不显示「某章引用」开关、节点标记或读取路径。
    ⑤原「财货」撤掉，改为「经济与资源」。至少包含货币与兑换、收入来源、购买力锚点、资源流动：
      1,000 文=1 两银；灵石只有坊市浮动价；宗门功绩不可转让；一文对应馒头或一次入阁费；
      杂役三十文月钱另包吃住。每个数字都能拿日常生活比较，不能只摆单位。
    ⑥金手指必须是一套完整机制，不是一个名字。要说清它是什么、解决什么问题、如何触发、奖励来自哪里、
      会给什么、不能做什么、别人看到什么、当前领过哪些。样书定为：人在现场完成首次到访或行为里程碑，
      获得与地点/行为相关的奖励；核心作用是缓慢修补道源；不能远程签、不能自选奖励、不能直接送境界。
    ⑦每个节点仍有供 agent 写作和冲突检查使用的边界，但这是内部 context，不在界面上贴「这层管什么」之类
      说明条。页面直接呈现节点名、内容、归属与关系。
    ⑧世界状态变化继续叠历史，不删旧层；留白仍是合法节点；改炼气层数时仍要拦第 7 章冲突。
      普通的世界生长由 agent 自己判断并直接同步，不强制作者逐条确认。例如井台第二次出现后，直接归到杂役院下；
      如果归错了，作者可直接编辑、让 agent 改，或从历史回退。
    ⑨世界志 vs 人物志仍看它管谁：管别人到某处会怎样 → 世界志；管某个人自己如何行动 → 人物志。
      两边靠引用互相跳转。
  · 引用能力（已做）：相关的两处虚线下划，hover 出对方那条，点一下跳过去。资料库和世界志、人物志、大纲、伏线、正文
    互相可达。这就是"不用纠结该住哪"的实现。
  · 自动整理：每章定稿后同步世界志、人物志、资料库、大纲和伏线。这是产品默认行为，不叫「background agent」，
    不向用户暴露内部任务名，不为普通归档留红点或要求确认。只在真正需要作者意图的决策上询问，或在冲突已存在时拦截。
  · 定位（用户语）：对专业作者是代笔，对业余/小白是亦师亦友。三条后果——
    ①凡 agent 做了判断的地方，结论直接给、理由收在一行后面（一套界面服务两种人，不做两个模式）；
    ②开书问一句"以前写过长篇吗"，只用来定那些"为什么"默认展开还是收起；
    ③"师"的边界：事实冲突必拦；写法建议只提一次，用户坚持就照做且不再劝（唠叨的产品用两周就关）。
  · 前三章按题材给节奏建议：做。这是写作常识不是市场数据，不联网不查数据，一份按题材写死的模板。

  两条已标出的风险：
  ① 命门——"完整 context 所以不漂移"在书短时靠全塞，写到五十万字必须压成一份"当前世界是什么样"
     的摘要再喂；压缩即丢失，丢掉的部分就是漂移的来源。这一版成不成基本取决于这份摘要怎么维护。
  ② 范例会同时携带语感和具体措辞；如果一次塞得太多或长期不替换，agent 容易复用同一批句式，甚至把范例里的情节带进新章。
     所以写章只取基准片段和 1—2 段相关范例，并在出现明显重复时更换范例。

onboarding_decisions: |
  · 开书不是资料填写流程，而是一条“自由讲述 → Agent 回声 → 一个关键追问 → 读者约定 → 短试写 →
    自然反馈 → 同场景重写 → 轻量确认 → 正式第一章”的创作校准流程。用户改口和推翻前面的理解属于正常创作，
    不能视为异常，也不能让已否定方向继续进入写作 context。
  · 第一屏允许从一个画面、一个人、一种读者快感、一个机制或一个已经想好的结局开始，并支持直接长篇讲述。
    原话永久保存；Agent 的复述和解释只是可推翻的理解，不能替代用户原话成为正式设定。
  · Agent 每轮只问一个下游影响最大、且必须由用户回答的问题。已经足够试写时就停止追问，通常 2—4 轮后写一段
    500—900 字的场景切片；每次只验证两三件事，未确定的名字、力量规则和世界细节保持留白。
  · 读者定位放在已经有一点故事轮廓之后、第一次试写之前。先问这次更优先“像心里的故事”还是“让陌生读者追下去”；
    确认商业连载后再问平台、男频/女频和核心阅读快感。分类只作为写作参考，不能覆盖作品本身。
  · 用户能自由反馈时不要求打分或选标签；说不清时才辅助问“哪一刻想继续看”和“从哪里开始觉得累、俗或不像你的故事”。
    重写尽量使用同一个场景，避免靠换故事制造已经校准的假象。
  · 参考文字不是开书门槛。首次试写后仍说不清文字差异、连续两版没有校准或用户主动提出时，才邀请粘贴自己的旧稿
    或 300—1000 字参考片段。只提取节奏、镜头距离、句式和信息密度，不带走人物、设定和原句。
  · 多视角审查只负责诊断：目标读者看弃读点，连载结构看承诺和成长空间，作品守门人检查是否偏离作者原意，
    连贯性审查核对事实。审查者只读同一份冻结材料，不修改正文；前台 Agent 最多合并成 2—3 条真正会改变下一版的意见。
  · 正式开写前只给一句轻量摘要：已经确定什么、仍在试什么、什么保持留白。普通读者不看 reviewer、模型、context 状态或文件归档过程。
  · 内容状态至少区分用户原话、Agent 理解、试写提案、正式设定、正式正文事实和已否定方向。“有点感觉”“好一些”
    只确认本轮的方向或笔法，不把试写中所有细节升级成正式设定。
  · 进入长期写作前，除开头外还要逐渐验证四个长篇发动机：可重复但能变化的章节乐趣、成长机制与代价、
    可持续揭开的长期谜团、人物内在变化。漂亮的第一章不能单独证明这本书撑得住长篇。

workflow_decisions: |
  · 开书草稿自动保存。作者关闭页面、切换作品或应用退出后，再次进入“开始一本新书”先看到继续入口；重新开始必须由作者明确触发。
  · 书名目录首项固定为“开始一本新书”，用分隔线与已有作品区分。所有已有作品共用同一套“左侧书内导航 + 中间正文或资料 + 右侧 Agent 信息流”工作台；切书只替换内容、进度与恢复位置。
  · 一件工作对应一条独立执行记录，并挂在章节、人物或资料条目上。新的任务重新组装材料；历史记录只供查看，不会悄悄进入新任务。
    同一本书同一时刻只允许一个会改正文或资料的任务运行；只读检查可以使用同一份冻结材料并行进行。
  · 章节对作者只显示有意义的阶段：安排待确认、写作中、初稿、修改中、定稿中、已定稿。讨论里的候选内容不会因为被提到就升级成安排，
    初稿不会进入长期 context，只有成功定稿的正文才成为事实。本章安排在写作和定稿检查期间生效，定稿后标记为已消费，
    只保留为创作历史和修改参考，不能与正式正文并列成为后续事实。
  · 每个阶段有唯一清楚的下一步：安排后是“按这个写”，初稿后是“定稿”，定稿后是“开始下一章”。这些是工作流操作，
    不是 Agent 猜用户可能想问什么；作者仍可直接在输入框里给其他要求。
    作者直接要求动笔时，Agent 在任务内部从已接受的指令冻结一份最小安排后直接写，不强迫作者额外确认，也不把全部聊天当作写作依据。
  · 初稿正文可直接编辑；选中文字后可让 Agent 只改所选位置。人工编辑和 Agent 修改都自动保存，并至少可以撤销最近一次修改。
  · 定稿是一次整体更新：正文、相关大纲、世界志、人物志、资料库、伏线和历史要么一起生效，要么都不进入正式 context。
    笔法默认不变；只有作者确认新的长期写法或正文范例时，才纳入同一次整体更新。
    普通事实自动整理；需要作者意图的关键新发明在写前询问，接受章节后不在定稿时重复询问。
    定稿检查失败时回到可编辑初稿，指出具体冲突，并给“改当前稿 / 修改旧事实 / 取消定稿”三个出口；作者拒绝的临时新设定必须先从当前稿删除或重写。
    “修改旧事实”是当前定稿任务的阻塞步骤：冻结当前初稿，成功后对同一份初稿重跑检查，失败或取消则回到原初稿，不另开并行任务。
  · 停止任务会保留最近一次保存的安排或初稿，不会同步资料。页面刷新、应用退出、切换资料或切换书籍都不等于取消任务；回来恢复最后检查点。
    写作中意外中断时显示“继续写”，定稿中意外中断时恢复到未定稿初稿，不能伪装为已成功。
  · 修改旧章或世界规则前先查直接影响。纯文字润色可以直接完成；改变谁在场、谁知道什么、力量规则或时间事实时，先列出受影响内容，
    再让作者选择保留原状、从下一篇未写章节起采用新版本，或连同指定旧章到当前为止所有相关正文、初稿、安排、摘要和索引一起修改。
    “从现在起”不能指一篇已经写过的章节；不能先改完再告警。回退较早的历史节点时，先按当前状态重新检查影响，
    再追加一笔反向整体修改，不删除后续历史；存在后续依赖时，先整体修改相关内容或取消回退。
  · 写作或修改第 N 章时，人物状态、知识、物品与世界规则都按“第 N 章当时”取材，不能拿后文才发生的事倒灌进前文。
    摘要和索引要记得自己来自哪一章、哪个正文版本；旧章事实变化后，相关摘要与索引随同一次更新重建。
  · 第一章和第三章定稿后各做一次轻量长篇检查：只指出 1—2 个真正影响后续的问题，分别检查开头承诺，以及可重复章节乐趣、成长代价、长期谜团和人物变化。
  · 本轮明确后置：导入已有长篇、版本分叉与对比、卷级折叠、完结与发布、多人协作、一次给剧情段目标后连续自动写多章。

tracking:
  needed:                               # 阶段二"数据回收判断"时确认后填 true/false

canvas:
  enabled: true
  consent_scope: [server]               # 本项目为 greenfield，无既有产品代码可考古，不跑 design token subagent
  port_note: 端口每次重启随机；state/server-info 里有当前 url（curl 记得加 --noproxy localhost）
  pages: |
    00 开书：无书时自由讲述 + 关键追问 + 短试写，并能恢复未完成的开书草稿；从已有作品进入时可随时返回原作品与原位置，草稿不丢；
      正式开写后进入统一书内工作台，不再承载第二套书籍详情页。
    04 统一书内工作台：采用作者中心的自适应三栏，三本样书共用左侧书内导航、中间正文/资料主舞台和可伸缩 Agent 执行轨。青云宗样书打通第 13 章安排→
      写作→停止/继续→编辑/选段修改/撤销→定稿检查/取消→资料同步→第 14 章，并展示设定改动先预检、再选择处理的冲突路径。Agent 执行轨按工作显示请求、
      查找、阅读、工具与生成、检查、等待决定、失败/重试和完成结果；完成后可按对象查看具体改动并定位，待决定事项会跨内容持续提示并阻塞新的创作任务。
      三本书的大纲、世界志、伏线、人物志、资料库和笔法逐类复用同一详情结构与交互，只替换各书正文、资料数据、进度和恢复位置。
    05 作品概览：暂时退出当前产品旅途，保留为 sandbox 供后续讨论。
    01—03 保留为早期骨架对照 sandbox，不进入当前产品旅途。
    视觉方向：纸与墨（暖白纸底 / 深墨字 / 朱砂强调 / 墨绿次强调），正文衬线、界面无衬线；正式页面共用统一颜色、间距、圆角、阴影、焦点与状态 token。
    书内只显示当前作品，点击书名展开轻量书籍目录，首项新建作品，其后列已有作品；1280 宽度下保持三栏可用且不产生横向裁切。

user_style_prefs:
  - 说人话、别像念 PPT/咨询报告：短句，一次说一个点
  - 少堆加粗、表格、层层标题；先用一句平白的话给结论，再展开
  - 别堆压缩术语和一串括号补充说明，读着费劲
  - 不要自造词；描述产品时用用户视角的具体说法，不用抽象的数据模型词汇（实体/透镜/派生视图只留在内部文档）
  - 接续/汇报时别把项目黑话连着堆；用具体例子把事讲清楚，一次只抛一个议题
  - 界面信息密度要克制：一屏一个焦点动作；角色/账目等细节收进 hover/点开的层级，不平铺全字段
  - 先讨论文字结论、再画原型；避免 build→react→rebuild 的反复
  - 世界信息必须先显示父子层级与归属，再渐进展开细节；不要用几页互不相干的平铺条目代替结构
  - 不用「财货」这种含义不明的分类；经济内容要直接写货币单位、兑换关系、收入和购买力锚点
  - 能力或金手指不能只给一个名称；必须能看懂用途、触发、收益、限制和当前进度
  - 不在界面上贴「这层管什么」「为什么这样设计」之类解释性胶布；结构和内容要自己说明问题
  - 不向普通用户暴露「background agent」等内部架构术语；用户只需要感知到内容已同步
  - 设定页是 agent context 的可见面，不是作者的日常维护台；默认自动生长，发现不对再编辑、让 agent 修改或回退
  - 不在世界志里放「某章引用」「会读哪些节点」等调试开关或路径标记；context 如何组装是 agent 内部问题
  - 模块名直接叫「大纲」，不用「纲目」；大纲的权威来自作者明确决定的故事，不来自结构完整或字段齐全
  - 时间轴必须支持开头和结尾已定、中间整段留白，也支持边写边想；只提醒一次跑偏风险，不阻断用户继续写
  - 创作内容不能强迫每段填写同一套起点、转折、落点、人物变化和必选事件；先服务剧情，不为把表填满而发明剧情
  - 同一条大纲信息只展示一次；不要先做一层总览、再用卡片重复，也不要为了说明「这里是空白」额外造一张留白卡
  - 大纲优先像普通文稿一样连续阅读；标题和段落能说清时，不要再翻译成时间轴、卡片或状态面板
  - 人物关系使用组织架构式的自上而下正交树：根节点在上，竖线接横向主干，再垂直落到各分支；不要用目录缩进树
  - MVP 人物档案使用自由 Markdown 文档，不设身份、动机、能力、随身、钱财等必填结构；内容有多少写多少，不用空字段补齐版面
  - 人物节点单击只看下方档案，双击才切换关系树中心；人物视图必须有面包屑、上一步和主角归位，避免在多层关系中迷路
  - 会反复出现且有独立规则的功法、技能和关键物品要有独立资料条目；提及时可以悬停看简介、点击跳转，并从条目返回原文
  - 笔法不能只剩抽象规则；要保留少量已经写对的正文范例，写章时只取基准片段和与当前场景相关的 1—2 段
  - 笔法不能把整本书压成短句近景和局部禁令；必须先说清作品的精神内核，并允许日常、冲突与宏大场面使用不同景别和节奏
  - 讨论或校准笔法时优先给一段可以直接感受的具象试写；不要让用户只在“宏大、悲壮、热血”等抽象形容词里做选择
  - 笔法页不要把「卷一」「当前卷」等作用范围做成前台标题或作者要维护的配置；当前故事的气息直接写进笔法正文，由 agent 随剧情推进整理
  - 开书牵引不能做成问卷或必填资料；先让用户自由讲，每轮只追问一个真正影响故事的问题，够试写就停止追问
  - 试写反馈优先接住用户自然表达；用户说不清时才给具体感受问题，不要求打分、贴标签或管理校准流程
  - 多模型审查和 subagent 是后台机制；前台只呈现少量经过判断的意见，不展示模型名单、投票、原始审稿清单或技术状态
  - 整体界面不能停在“功能已经摆齐”的原型感；入口、书籍详情和书内工作区需要统一的排版节奏、空间层次、控件状态与产品气质，达到成熟桌面产品的精致度
  - 书内侧栏固定按“新建章节 → 资料 → 正文”排列；资料入口保持在上方，正文列表独立滚动，不能因章节增长把资料挤到下面
  - “开始一本新书”放在书籍目录最上方，并与已有作品用分隔线区分；不要把它做成书名旁边语义不明的独立加号
  - 所有作品共用同一套书内工作台；切换作品只能替换内容、进度与恢复位置，不能让不同作品进入不同结构的详情页
  - 跨作品不能只统一外层工作台；大纲、世界志、伏线、人物志、资料库和笔法的详情结构与交互也必须逐类一致，只替换各书数据
  - MVP 章节列表先全部平铺，不用“第 1—9 章”合并占位，也不增加卷级折叠
  - 本章安排只说会发生什么，不提前写动作、镜头和对白；确实需要补充时用“标题 + 描述”
  - 不用“谁知道”“这章勾掉”“还差几件”等内部整理卡或进度暗语向作者解释 Agent context
  - 右侧 Agent 像代码 Agent 一样展示连续工作信息流，不使用一张张聊天气泡
  - 不显示“这一轮读了什么”等 context 调试信息，也不放猜你想问；用户想问什么就自己输入
  - Agent 执行过程不能只显示一句“正在处理”再跳到“已完成”；要按时间显示用户可理解、可验证的动作，例如查找资料、阅读相关内容、调用工具、生成、检查与写入结果，并区分进行中、完成、失败、停止和等待用户决定
  - Agent 信息流展示的是外部动作、状态和产物，不暴露隐藏推理、原始 context 拼装或内部调试日志；默认给简明摘要，需要时再展开查看查询、命中结果、工具输入输出和改动差异
  - 开始一本新书是可随时退出的临时流程；从已有作品进入后，全程都要能返回刚才的作品与原位置，已经产生的开书草稿不能因此丢失
  - 返回操作必须和当前页面身份组成同一导航序列；不要把返回与页面标题分散在顶栏两端，形成两个互不相干的动作

