      骨架＝本地文件夹＋纯文本设定与正文＋全历史版本管理，git 术语不露；四条拍板（节奏两种都要默认一章
      一拍／开书跟 agent 聊出来／自由发挥分大小／文风贴范文或让 agent 去搜读提取）；范围止于"能稳定日更"。
