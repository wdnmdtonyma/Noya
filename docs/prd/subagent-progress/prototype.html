.noya{height:100dvh;display:flex}
.main-column{flex:1;min-width:0;display:flex;flex-direction:column}

.sidebar{--sidebar-full:252px;--sidebar-rail:60px;--sidebar-dur:280ms;position:relative;z-index:4;width:var(--sidebar-full);flex-shrink:0;display:flex;min-height:0;border-right:1px solid var(--color-border);background:var(--color-bg-subtle)}

  transition:width var(--sidebar-dur) var(--ease-in-out),background var(--dur-fast) var(--ease-out),box-shadow var(--dur-base) var(--ease-out),color var(--dur-fast) var(--ease-out)}

.task-status[data-tone=stopped] .dot,.task-status[data-tone=stopping] .dot,.task-status[data-tone=interrupted] .dot,.task-status[data-tone=offline] .dot{background:var(--color-warn)}

/* ---------- Buttons ---------- */
.secondary,.primary,.quiet{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 var(--space-3);border-radius:var(--radius-control);font-size:var(--font-size-sm);font-weight:500;white-space:nowrap}
.secondary{background:var(--color-surface);border:1px solid var(--color-border-strong);color:var(--color-text);box-shadow:var(--shadow-xs)}
.secondary:hover:not(:disabled){border-color:var(--paper-350);background:var(--color-surface-raised)}
.primary{background:var(--color-primary);color:var(--color-text-inverse);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,var(--shadow-xs)}
.primary:hover:not(:disabled){background:var(--color-primary-hover)}
.quiet{background:transparent;color:var(--color-text-secondary)}
.quiet:hover:not(:disabled){background:var(--color-bg-hover);color:var(--color-text)}
.primary:disabled,.secondary:disabled,.quiet:disabled{background:var(--color-surface-sunken);border-color:transparent;color:var(--color-text-disabled);box-shadow:none}
.icon-button{display:grid;place-items:center;background:transparent;color:var(--color-text-secondary);width:30px;height:30px;border-radius:var(--radius-md)}
.icon-button svg{width:16px;height:16px}

/* ---------- Feed ---------- */
.feed{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:var(--space-4) var(--space-12) var(--space-8);scrollbar-width:thin;scrollbar-color:var(--color-border-strong) transparent;overscroll-behavior:contain;scroll-padding-block:var(--space-5);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 18px,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 18px,#000 calc(100% - 22px),transparent 100%)}
.event-list{display:flex;flex-direction:column;min-width:0;margin:0;padding:0}
.event-item{min-width:0;max-width:100%;margin:0 0 var(--space-2);scroll-margin-block:var(--space-5);font-size:14.5px;line-height:1.85}
.event-item:last-child{margin-bottom:0}
.event-body{min-width:0;overflow-wrap:anywhere}
.message-content,.thinking-content,.content-preview{white-space:pre-wrap;overflow-wrap:anywhere}
.message-content{color:var(--color-text);font:inherit;margin:0}
.type-message{margin:var(--space-3) 0 var(--space-3)}
.type-message:first-child{margin-top:0}

/* Agent identity mark — matches production "N · CONTEXT AGENT" label */
.agent-mark{display:flex;align-items:center;gap:7px;margin-bottom:6px;color:var(--color-text-secondary);font-size:10px;letter-spacing:1.4px;text-transform:uppercase}
.agent-glyph{display:inline-grid;place-items:center;width:18px;height:18px;border:1px solid var(--color-border-strong);border-radius:5px 2px 5px 2px;background:var(--color-surface);color:var(--color-accent);font:italic 600 12px/1 Georgia,serif;letter-spacing:0;text-transform:none}

/* Author message */
.event-item.is-user{align-self:flex-end;max-width:min(78%,560px);margin:var(--space-6) 0 var(--space-5);padding:10px 16px;border:1px solid var(--color-border);border-radius:16px 16px 4px 16px;background:var(--color-surface-raised);box-shadow:var(--shadow-xs);font-size:14px;line-height:1.75}
.event-item.is-user:first-child{margin-top:var(--space-2)}

/* ---------- Activity rows (groups, tools, thinking) share one row grammar ---------- */
.process-head,.tool-head,.thinking-head{display:flex;align-items:center;gap:var(--space-2);width:calc(100% + 16px);min-height:32px;margin:0 -8px;padding:4px 8px;border-radius:var(--radius-md);background:transparent;color:var(--color-text-secondary);text-align:left;font-size:13px;line-height:1.6}
.process-head:hover,.tool-head:hover,.thinking-head:hover{background:var(--color-bg-hover);color:var(--color-text)}
.process-head:focus-visible,.tool-head:focus-visible,.thinking-head:focus-visible{outline-offset:-2px}
.row-icon{width:15px;height:15px;color:var(--color-text-tertiary);stroke-width:1.5}
.process-head:hover .row-icon,.tool-head:hover .row-icon,.thinking-head:hover .row-icon{color:var(--color-text-secondary)}
.chevron{width:13px;height:13px;color:var(--color-text-tertiary);transition:transform var(--dur-base) var(--ease-out);opacity:.8}
[aria-expanded=true]>.chevron{transform:rotate(180deg)}
.process-head .chevron,.tool-head .chevron,.thinking-head .chevron{opacity:0}
.process-head:hover .chevron,.tool-head:hover .chevron,.thinking-head:hover .chevron,[aria-expanded=true]>.chevron,.process-head:focus-visible .chevron,.tool-head:focus-visible .chevron,.thinking-head:focus-visible .chevron{opacity:.85}
.process-group{margin:var(--space-1) 0;min-width:0;scroll-margin-block:var(--space-5)}
.process-summary{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.process-count{flex-shrink:0;font-size:10px;color:var(--color-text-tertiary);padding:0 6px;border-radius:var(--radius-pill);background:var(--color-surface-sunken);line-height:17px}
.process-states{margin-left:auto;display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:var(--space-2);flex-shrink:0;max-width:55%}
.process-details{position:relative;margin:2px 0 var(--space-2) 7px;padding:2px 0 2px 16px;border-left:1px solid var(--color-border)}
.process-details .event-item{margin:0}
.process-details .type-message{margin:var(--space-2) 0}

.activity-label{min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.activity-label code{font:12px/1.6 var(--font-mono);color:var(--color-text);opacity:.82}
.activity-verb{color:inherit}
.tool-call{min-width:0;max-width:100%}
.tool-state{display:inline-flex;align-items:center;gap:5px;margin-left:auto;flex-shrink:0;padding:0 7px;border-radius:var(--radius-pill);font-size:10.5px;line-height:18px;white-space:nowrap;color:var(--color-text-secondary);background:var(--color-surface-sunken)}
.tool-state.status-running{color:var(--color-accent);background:var(--color-accent-soft)}
.tool-state.status-error{color:var(--color-danger);background:var(--color-danger-soft)}
.tool-state.status-completed{color:var(--color-text-secondary);background:var(--color-surface-sunken)}
.tool-state.status-stopped,.tool-state.status-interrupted{color:var(--color-warn);background:var(--color-warn-soft)}
.call-meta .tool-state{margin-left:0}

/* Expanded tool: quiet inspector panel */
.tool-details{min-width:0;margin:4px 0 var(--space-3);padding:var(--space-3);border:1px solid var(--color-border-soft);border-radius:var(--radius-md);background:var(--color-surface);font-size:var(--font-size-sm);line-height:1.7}
.call-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin:0 0 var(--space-3);color:var(--color-text-tertiary);font:10.5px/1.6 var(--font-mono);overflow-wrap:anywhere}
.call-meta>span,.call-meta>code{padding:0 6px;border-radius:4px;background:var(--color-bg-subtle);line-height:18px}
.call-meta>code{color:var(--color-text-secondary)}
.payload-label,.tool-output-title{display:flex;align-items:center;gap:6px;margin:0 0 6px;color:var(--color-text-tertiary);font-size:10px;font-weight:550;letter-spacing:1.2px;line-height:1.6}
.tool-output-title{margin-top:var(--space-3)}
.raw-content{display:block;width:100%;max-width:100%;margin:0;padding:10px 12px;overflow-x:auto;white-space:pre;border:1px solid var(--color-border-soft);border-radius:var(--radius-sm);background:var(--color-bg-subtle);color:var(--color-text);font:11.5px/1.7 var(--font-mono);tab-size:2;scrollbar-width:thin;scrollbar-color:var(--color-border-strong) transparent;overscroll-behavior-inline:contain}
.raw-content code{font:inherit}
.raw-content.content-preview{white-space:pre;overflow-wrap:normal}
.tool-output-title.tool-error{color:var(--color-danger);background:transparent;border:0;padding:0;margin-top:var(--space-3)}
.raw-content.tool-error{border-color:color-mix(in srgb,var(--color-danger) 25%,transparent);background:var(--color-danger-soft);color:var(--color-danger);white-space:pre-wrap}
.call-meta:not(:first-child){margin:var(--space-3) 0 0;font-family:var(--font-ui)}
.streaming-dot{position:relative;display:inline-block;width:6px;height:6px;flex-shrink:0;border-radius:var(--radius-pill);background:var(--color-accent);vertical-align:middle}
.streaming-dot::after{content:"";position:absolute;inset:-2px;border-radius:inherit;border:1.5px solid var(--color-accent);opacity:0;animation:ripple 1.8s var(--ease-out) infinite}
.full-text{display:inline-flex;align-items:center;gap:var(--space-1);margin-top:6px;padding:2px 0;background:transparent;color:var(--color-accent);font-size:var(--font-size-xs);line-height:1.6}
.full-text:hover{text-decoration:underline;text-underline-offset:3px}

/* Thinking */
.thinking-call{min-width:0}
.thinking-head small{font-size:10.5px;color:var(--color-text-tertiary);margin-left:auto}
.thinking-details{margin:4px 0 var(--space-2) 7px;padding:2px 0 2px 16px;border-left:1px dashed var(--color-border-strong)}
.thinking-content{font:italic 13px/1.85 var(--font-prose);color:var(--color-text-secondary);margin:0}
.redacted-note{display:block;color:var(--color-text-tertiary);font-size:var(--font-size-xs);line-height:1.65}

/* System lifecycle events read as quiet dividers */
.type-system{margin:var(--space-3) 0}
.system-content{min-width:0}
.system-head{display:flex;align-items:center;gap:var(--space-2);width:100%;padding:2px 0;background:transparent;color:var(--color-text-tertiary);font-size:10.5px;letter-spacing:.6px;line-height:1.6;text-align:center}
.system-head:hover{color:var(--color-text-secondary)}
.system-rule{flex:1;height:1px;background:var(--color-border)}
.system-label{flex-shrink:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.system-head .chevron{width:11px;height:11px;margin-left:-4px;opacity:.6}
.tone-warn .system-head{color:var(--color-warn)}
.tone-danger .system-head{color:var(--color-danger)}
.tone-done .system-head{color:var(--color-done)}
.system-raw{margin-top:var(--space-2);padding:var(--space-3);border:1px solid var(--color-border-soft);border-radius:var(--radius-md);background:var(--color-surface)}
.system-raw .call-meta{margin:0 0 var(--space-2);font-family:var(--font-ui)}
.system-text{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font:11.5px/1.7 var(--font-mono);color:var(--color-text-secondary)}

/* ---------- Saved artifact ---------- */
.type-artifact{margin:var(--space-3) 0}
.artifact-link{display:flex;align-items:center;gap:var(--space-3);width:100%;min-width:0;padding:12px 14px 12px 12px;border:1px solid var(--color-border);border-radius:11px;background:var(--color-surface);box-shadow:var(--shadow-xs);color:var(--color-text);text-align:left}
.artifact-link:hover{border-color:color-mix(in srgb,var(--color-primary) 35%,var(--color-border));box-shadow:var(--shadow-sm)}
.artifact-tile{display:grid;place-items:center;width:36px;height:40px;flex-shrink:0;border-radius:6px 3px 6px 6px;background:var(--color-primary-softer);color:var(--color-primary);border:1px solid var(--color-primary-soft)}
.artifact-tile svg{width:17px;height:17px}
.kind-review .artifact-tile{background:var(--color-accent-softer);color:var(--color-accent);border-color:var(--color-accent-soft)}
.kind-plan .artifact-tile{background:var(--color-info-soft);color:var(--color-info);border-color:color-mix(in srgb,var(--color-info) 15%,transparent)}
.artifact-text{flex:1;min-width:0}
.artifact-text strong{display:block;font:550 15px/1.5 var(--font-prose);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artifact-kind{display:block;color:var(--color-text-tertiary);font-size:10.5px;line-height:1.5}
.artifact-kind code{font-size:10px}
.artifact-open{display:inline-flex;align-items:center;gap:2px;flex-shrink:0;color:var(--color-text-secondary);font-size:var(--font-size-xs)}
.artifact-open svg{width:14px;height:14px}
.artifact-link:hover .artifact-open{color:var(--color-primary)}
.badge{flex-shrink:0;font-size:10px;line-height:18px;letter-spacing:.2px;color:var(--color-text-secondary);background:var(--color-surface-sunken);padding:0 7px;border-radius:4px;font-style:normal;white-space:nowrap}
.badge.done{background:var(--color-done-soft);color:var(--color-done)}
.badge.running{background:var(--color-accent-soft);color:var(--color-accent)}
.badge.failed{background:var(--color-danger-soft);color:var(--color-danger)}
.badge.stopped,.badge.terminated{background:var(--color-warn-soft);color:var(--color-warn)}

/* ---------- Dispatch entry (Main → Sub) ---------- */
.type-dispatch{margin:6px 0}
.dispatch-card{min-width:0;border:1px solid var(--color-border);border-radius:10px;background:var(--color-surface);overflow:hidden;transition:border-color var(--dur-fast),box-shadow var(--dur-fast)}
.dispatch-card:hover{border-color:var(--color-border-strong);box-shadow:var(--shadow-xs)}
.dispatch-card.status-running{border-color:color-mix(in srgb,var(--color-accent) 30%,var(--color-border));background:linear-gradient(90deg,var(--color-accent-softer),var(--color-surface) 60%)}
.dispatch-card.status-failed{border-color:color-mix(in srgb,var(--color-danger) 30%,var(--color-border))}
.type-dispatch+.type-dispatch{margin-top:-7px}
.type-dispatch:has(+.type-dispatch) .dispatch-card{border-bottom-left-radius:0;border-bottom-right-radius:0}
.type-dispatch+.type-dispatch .dispatch-card{border-top-left-radius:0;border-top-right-radius:0}
.type-dispatch .dispatch-card:hover,.type-dispatch .dispatch-card.status-running,.type-dispatch .dispatch-card.status-failed{position:relative;z-index:1}
.dispatch-row{display:flex;align-items:stretch;min-width:0}
.dispatch-link{flex:1;display:flex;align-items:center;gap:10px;min-width:0;padding:6px 6px 6px 8px;background:transparent;text-align:left;font-size:13px;line-height:1.5}
.agent-tile{display:grid;place-items:center;width:24px;height:24px;flex-shrink:0;border-radius:7px;background:var(--color-surface-sunken);color:var(--color-text-secondary)}
.agent-tile svg{width:14px;height:14px}
.status-running .agent-tile{background:var(--color-accent-soft);color:var(--color-accent)}
.status-failed .agent-tile{background:var(--color-danger-soft);color:var(--color-danger)}
.status-stopped .agent-tile,.status-interrupted .agent-tile{background:var(--color-warn-soft);color:var(--color-warn)}
.dispatch-kind{flex-shrink:0;font-size:var(--font-size-xs);color:var(--color-text-tertiary)}
.dispatch-name{font:550 12.5px/1.5 var(--font-mono);color:var(--color-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dispatch-open{display:inline-flex;align-items:center;gap:1px;margin-left:auto;flex-shrink:0;padding:2px 4px 2px 8px;border-radius:var(--radius-sm);color:var(--color-text-tertiary);font-size:var(--font-size-xs)}
.dispatch-open svg{width:13px;height:13px}
.dispatch-link:hover .dispatch-open{color:var(--color-accent);background:var(--color-accent-softer)}
.dispatch-raw{display:grid;place-items:center;flex-shrink:0;width:34px;background:transparent;color:var(--color-text-tertiary);border-left:1px solid var(--color-border-soft)}
.dispatch-raw:hover{color:var(--color-text);background:var(--color-bg-hover)}
.dispatch-raw svg{width:13px;height:13px;transition:transform var(--dur-base) var(--ease-out)}
.dispatch-raw[aria-expanded=true] svg{transform:rotate(180deg)}
.dispatch-card>.tool-call{border-top:1px solid var(--color-border-soft);padding:0 10px}
.dispatch-card .dispatch-tool>.tool-head{display:none}
.dispatch-card .dispatch-tool .tool-details{margin:10px 0;border:0;padding:0;background:transparent}
.sub-status{display:inline-flex;align-items:center;gap:5px;flex-shrink:0;padding:0 7px;border-radius:var(--radius-pill);font-size:10.5px;line-height:18px;white-space:nowrap;color:var(--color-text-secondary);background:var(--color-surface-sunken)}
.sub-status.status-running{color:var(--color-accent);background:var(--color-accent-soft)}
.sub-status.status-failed{color:var(--color-danger);background:var(--color-danger-soft)}
.sub-status.status-stopped,.sub-status.status-interrupted{color:var(--color-warn);background:var(--color-warn-soft)}
.dispatch-text{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.target-unavailable{color:var(--color-text-tertiary);font-size:var(--font-size-xs)}

/* ---------- Notices, empty, fresh-content ---------- */
.task-notice{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:var(--font-size-sm);line-height:1.7;padding:12px 14px;margin-top:var(--space-5);border:1px solid color-mix(in srgb,var(--color-warn) 22%,transparent);border-radius:10px;background:var(--color-warn-soft);color:var(--color-warn)}
.task-notice>svg{width:16px;height:16px}
.task-notice>span{flex:1;min-width:200px}
.task-notice[data-tone=failed]{border-color:color-mix(in srgb,var(--color-danger) 22%,transparent);background:var(--color-danger-soft);color:var(--color-danger)}
.task-notice .quiet{height:26px;padding:0 10px;font:inherit;font-weight:550;color:inherit;background:rgba(255,255,255,.55);border:1px solid currentColor;border-color:color-mix(in srgb,currentColor 25%,transparent)}
.task-notice .quiet:hover{background:var(--color-surface-raised);color:inherit}
.task-notice .quiet svg{width:13px;height:13px}
.new-events{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);align-self:center;flex-shrink:0;max-width:calc(100% - 32px);margin:var(--space-1) var(--space-4);padding:5px 14px;border:1px solid var(--color-border-strong);border-radius:var(--radius-pill);background:var(--color-surface-raised);color:var(--color-accent);box-shadow:var(--shadow-md);font-size:var(--font-size-xs);line-height:1.55}
.new-events:hover{background:var(--color-accent-softer)}
.new-events svg{width:13px;height:13px}
.empty-flow,.filter-empty{padding:var(--space-8) 0;color:var(--color-text-secondary);font-size:var(--font-size-md);line-height:1.85}
.empty-flow{max-width:420px;margin:8vh auto 0;text-align:center}
.empty-flow h2{margin-bottom:var(--space-3);color:var(--color-text);font:500 26px/1.5 var(--font-prose);letter-spacing:.5px}
.empty-page{position:relative;width:64px;height:78px;margin:0 auto var(--space-6);padding:18px 12px;border:1px solid var(--color-border-strong);border-radius:4px 14px 4px 4px;background:var(--color-surface-raised);box-shadow:var(--shadow-sm);transform:rotate(-3deg)}
.empty-page i{display:block;height:2px;margin-bottom:8px;border-radius:2px;background:var(--color-border)}
.empty-page i:nth-child(2){width:80%}.empty-page i:nth-child(3){width:55%;background:var(--color-primary-soft)}
.filter-empty button{margin-top:var(--space-3)}

/* ---------- Composer & subtask float ---------- */
.composer-area{position:relative;padding:var(--space-2) var(--space-12) var(--space-4);flex-shrink:0}
.subtask-anchor{position:relative;display:flex;margin-bottom:var(--space-2);min-width:0}
.subtask-capsule{display:inline-flex;align-items:center;gap:7px;max-width:100%;height:30px;padding:0 10px 0 9px;border:1px solid var(--color-border);border-radius:var(--radius-pill);background:var(--color-surface);color:var(--color-text-secondary);font-size:var(--font-size-sm);line-height:1;white-space:nowrap;box-shadow:var(--shadow-xs)}
.subtask-capsule:hover,.subtask-capsule[aria-expanded=true]{background:var(--color-surface-raised);color:var(--color-text);border-color:var(--color-border-strong)}
.subtask-capsule svg{width:14px;height:14px;color:var(--color-text-tertiary)}
.subtask-capsule .chevron{width:12px;height:12px;opacity:1}
.subtask-capsule[data-tone=running]{color:var(--color-accent);border-color:color-mix(in srgb,var(--color-accent) 28%,var(--color-border));background:var(--color-accent-softer)}
.subtask-capsule[data-tone=running]>svg:first-child{color:var(--color-accent)}
.subtask-capsule[data-tone=failed]{color:var(--color-danger);border-color:color-mix(in srgb,var(--color-danger) 28%,var(--color-border));background:var(--color-danger-soft)}
.subtask-capsule[data-tone=failed]>svg:first-child{color:var(--color-danger)}
.subtask-float{position:absolute;z-index:7;left:0;right:0;bottom:calc(100% + 8px);display:flex;flex-direction:column;max-height:min(460px,var(--floating-height,60dvh));min-width:0;border:1px solid var(--color-border-strong);border-radius:14px;background:var(--color-surface);box-shadow:var(--shadow-lg);overflow:hidden;transform-origin:bottom left;animation:float-in var(--dur-base) var(--ease-out)}
.subtask-float[data-view=detail]{max-height:min(640px,var(--floating-height,72dvh))}
.subtask-float-header{display:flex;align-items:center;gap:var(--space-2);padding:10px 10px 10px var(--space-4);flex-shrink:0;border-bottom:1px solid var(--color-border-soft);background:var(--color-surface-2)}
.subtask-float[data-view=detail] .subtask-float-header{padding-left:var(--space-2)}
.float-title{flex:1;min-width:0}
.float-status{display:flex;align-items:center;gap:var(--space-2);font-size:var(--font-size-md);line-height:1.5;color:var(--color-text)}
.float-status strong{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subtask-float[data-view=detail] .float-status strong{font:600 12.5px/1.5 var(--font-mono)}
.float-count{display:inline-block;min-width:18px;padding:0 5px;border-radius:var(--radius-pill);background:var(--color-surface-sunken);color:var(--color-text-secondary);font-size:10.5px;line-height:17px;text-align:center}
.subtask-float-header small{display:block;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--font-size-xs);color:var(--color-text-tertiary)}
.subtask-float-header .icon-button{flex-shrink:0;width:28px;height:28px}
.subtask-float-list{flex:1;min-height:0;overflow:auto;padding:6px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--color-border-strong) transparent}

/* ---------- Input ---------- */
.reference{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);background:var(--color-primary-softer);border:1px solid var(--color-primary-soft);padding:4px 6px 4px 12px;border-radius:var(--radius-md);font-size:var(--font-size-xs);color:var(--color-primary);margin-bottom:var(--space-2)}

.reader{width:48%;max-width:850px;flex-shrink:0;min-width:360px;border-left:1px solid var(--color-border);background:var(--color-surface);display:flex;flex-direction:column;box-shadow:-12px 0 32px -24px rgba(42,35,27,.25);animation:reader-in var(--dur-slow) var(--ease-out)}

.reader-footer .secondary:first-child{margin-right:auto}

/* ---------- Dialogs & toast ---------- */
dialog{width:min(480px,calc(100vw - 32px));max-height:calc(100dvh - 48px);padding:var(--space-6);border:1px solid var(--color-border);border-radius:var(--radius-dialog);background:var(--color-surface);box-shadow:var(--shadow-lg);color:var(--color-text)}
dialog[open]{animation:dialog-in var(--dur-base) var(--ease-out)}

.dialog-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-4)}

.picker-row.selected{background:var(--color-primary-softer);border-color:var(--color-primary-soft)}

.blank{padding:var(--space-12) var(--space-4);text-align:center}
.blank h2{font:24px var(--font-prose);margin-bottom:var(--space-4)}
.blank p{font-size:var(--font-size-md);color:var(--color-text-secondary);line-height:1.85}
.agent-option{align-items:flex-start}
.agent-option .agent-option-meta{display:block;margin-top:var(--space-1);color:var(--color-text-secondary);font:10px/1.7 var(--font-mono);overflow-wrap:anywhere}

/* ---------- Motion ---------- */
.pulse{animation:pulse 2s ease-in-out infinite}
.spin{animation:spin 2s linear infinite}
@keyframes pulse{50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ripple{0%{opacity:.5;transform:scale(.5)}100%{opacity:0;transform:scale(1.8)}}

@keyframes dialog-in{from{opacity:0;transform:translateY(8px) scale(.98)}}

@keyframes tip-in{from{opacity:0;transform:translate(-4px,-50%)}}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,8px)}}

  <style>
    /* ====================================================================
       This wrapper adds NO visible chrome. The prototype IS the product,
       full-bleed — there is no "prototype viewer" sidebar, no page list,
       no "共 N 页" header. Each page fragment draws the product's own shell
       (nav / header) as its content, and pages connect to each other
       through real in-product buttons (<a href="/p/<slug>">), not a meta nav.
       All this wrapper provides: a global reset, base typography pulled from
       the project's design tokens, and an invisible hot-reload toast.
       ==================================================================== */
    /* Smooth cross-document transitions on same-origin navigation. When a page
       gives its product-shell container `view-transition-name: app-shell`, the
       browser morphs that shell (it appears to STAY PUT) while only the content
       cross-fades — so clicking a real in-product button feels like a live app,
       not a full page reload + white flash. Browsers without support just
       hard-navigate (today's behavior); prefers-reduced-motion is honored. */
    @view-transition { navigation: auto; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: var(--font-family-base, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif);
      color: var(--color-text, #1a1a1a);
      background: var(--color-bg, #ffffff);
    }
    /* Transient toast shown for ~1.2s when the canvas hot-reloads during a
       design session. Not product chrome: invisible by default, and the
       script that triggers it is stripped entirely from the deployed/static
       build, so the shipped prototype never shows it. */
    #frame-reload-banner {
      position: fixed;
      top: 12px;
      right: 12px;
      background: rgba(26, 26, 26, 0.9);
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      opacity: 0;
      transition: opacity .25s;
      pointer-events: none;
      z-index: 99999;
    }
    #frame-reload-banner.visible { opacity: 1; }
  </style>

      t.events.filter(e=>e.type==='tool'&&e.status==='running').forEach(e=>{e.status='stopped';e.ended=Date.now();});
      t.agents.filter(a=>a.status==='running').forEach(a=>{a.status='stopped';appendEvent(t,{type:'system',agentId:a.id,round:a.round,text:'agent_end · stopReason=aborted'});});t.status='stopped';state.activeRef=null;state.job=null;return;
    }
    if(op.op==='finish'){t.status=op.status;t.agents.filter(a=>a.status==='running').forEach(a=>a.status='idle');state.activeRef=null;state.job=null;}
  }
  function tick(force=false) {
    if(!state.connected){if(!frozen&&Date.now()>state.reconnectAt){state.connected=true;delete state.reconnectAt;render();}return;}
    if((frozen&&!force)||!state.job||Date.now()<state.job.nextAt)return;
    const job=state.job,t=taskAt(job);if(!t){state.job=null;return;}
    const visible=state.workId===job.workId&&state.taskId===job.taskId;
    const follow=visible&&!state.reader&&!state.floatingOpen&&$('feed').scrollHeight-$('feed').scrollTop-$('feed').clientHeight<70;
    const mainBefore=JSON.stringify(t.events.filter(e=>e.agentId==='main'));
    for(const op of job.steps[job.stage]||[])applyOperation(t,op);
    if(state.job){state.job.stage++;state.job.nextAt=Date.now()+7000;if(state.job.stage>=state.job.steps.length){state.job=null;state.activeRef=null;t.status='idle';}}
    const mainChanged=mainBefore!==JSON.stringify(t.events.filter(e=>e.agentId==='main'));
    if(mainChanged&&!follow)t.unseen++;render({bottom:mainChanged&&follow});
  }
  function finalize(){const r=task().results[state.reader];if(!r?.canFinalize||r.finalized||state.activeRef||!state.connected)return;dialog('确认将这一版定稿？',`<p class="picker-context">${esc(r.title)} 将成为正式正文。后续资料处理仍完整记录在这个任务里。</p><div class="dialog-footer"><button class="secondary" data-action="cancel">再读一读</button><button class="primary" data-action="confirm-finalize">确认定稿</button></div>`);}
  function confirmFinalize(){const t=task(),r=t.results[state.reader];if(!r||state.activeRef||!state.connected)return;r.finalized=true;t.status='running';t.agents[0].status='running';appendEvent(t,{type:'system',agentId:'main',round:t.agents[0].round,text:`artifact_finalized · artifact_id=${r.id} · confirmed_by=author`});const id=`sync-${++state.sequence}`;const spawn=toolEvent(t,'main','spawn_subagent',{agent_id:id,task:'核对已定稿正文对应的资料变化',artifact_id:r.id},{agent_id:id},{childId:id});addAgent(t,id,'main',spawn.callId);const call=toolEvent(t,id,'read',{artifact_id:r.id,change_set:'changes-01'},'',{status:'running',updates:[]});state.activeRef={workId:state.workId,taskId:t.id};state.job={...state.activeRef,stage:0,nextAt:Date.now()+7000,steps:syncSteps(t,call.id,id)};closeDialog();render();toast('已定稿，后续执行记录继续保留');}
  function handle(event){
    const button=event.target.closest('button');if(!button||button.disabled)return;const t=task(),viewTask=button.closest('#subtask-float')?floatingTask(t):t;
    if(button.dataset.result){openResult(button.dataset.result);return;}
    if(button.dataset.work){const w=state.works.find(w=>w.id===button.dataset.work);if(w.id===state.workId){worksOpen=false;render();$('work-picker').focus({preventScroll:true});return;}select(w.id,w.tasks[0].id);return;}
    if(button.dataset.task){select(state.workId,button.dataset.task);return;}
    switch(button.dataset.action){
      case 'open-subtask':openSubtask(button.dataset.agentId);break;
      case 'back-subtasks':backSubtasks();break;
      case 'toggle-tool':
      case 'toggle-event':{const id=button.dataset.eventId;viewTask.eventExpanded[id]=!viewTask.eventExpanded[id];render();break;}
      case 'toggle-group':{const id=button.dataset.groupId;viewTask.groupExpanded[id]=!viewTask.groupExpanded[id];render();break;}
      case 'toggle-subtasks':toggleFloating();break;
      case 'close-subtasks':closeFloating(true);break;
      case 'toggle-subtask-history':t.subtaskHistoryExpanded=!t.subtaskHistoryExpanded;render();break;
      case 'full-text':viewTask.fullText[button.dataset.contentKey]=!viewTask.fullText[button.dataset.contentKey];render();break;
      case 'latest':t.unseen=0;render({bottom:true});break;
      case 'new-task':newTask();break;
      case 'toggle-sidebar':toggleSidebar();break;
      case 'close-drawer':drawerOpen=false;render();break;
      case 'toggle-tasks':hideTip();tasksOpen=!tasksOpen;worksOpen=false;render();if(tasksOpen)$('task-flyout').querySelector('.selected')?.focus({preventScroll:true});break;
      case 'toggle-works':hideTip();worksOpen=!worksOpen;tasksOpen=false;render();if(worksOpen)$('work-list').querySelector('.selected')?.focus({preventScroll:true});break;
      case 'return-active':if(state.activeRef)select(state.activeRef.workId,state.activeRef.taskId);break;
      case 'stop-active':stopTask();break;
      case 'close-reader':closeReader();break;
      case 'revise':t.reference=state.reader;closeReader();$('message').focus();toast('已引用这份正文，意见发送给 Main');break;
      case 'clear-reference':t.reference=null;render();break;
      case 'finalize':finalize();break;
      case 'confirm-finalize':confirmFinalize();break;
      case 'cancel':closeDialog();break;
      case 'reconnect':state.connected=true;delete state.reconnectAt;render();toast('已恢复连接，现有记录保持原位');break;
      case 'retry-result':if(!state.connected){toast('连接尚未恢复，已加载内容仍可阅读');return;}if(t.results[state.reader])t.results[state.reader].broken=false;render();break;
    }
  }
  document.addEventListener('pointerdown',event=>{if(state.floatingOpen&&!$('subtask-anchor').contains(event.target))closeFloating();if(worksOpen&&!event.target.closest('#work-picker,#work-list')){worksOpen=false;render();}if(tasksOpen&&!event.target.closest('#task-switch,#task-flyout')){tasksOpen=false;render();}});
  document.addEventListener('click',handle);
  $('message').addEventListener('input',()=>{task().input=$('message').value;save();$('send').disabled=!task().input.trim()||!state.connected||elsewhere()||task().status==='stopping';});
  $('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();submit();}});
  document.addEventListener('keydown',e=>{
    if((e.metaKey||e.ctrlKey)&&!e.altKey&&!e.shiftKey&&e.key==='\\'){e.preventDefault();toggleSidebar();return;}
    if(e.key==='Escape'&&state.floatingOpen){e.preventDefault();e.stopPropagation();closeFloating(true);return;}
    if(e.key==='Escape'&&tasksOpen&&!$('picker-dialog').open){e.preventDefault();tasksOpen=false;render();$('task-switch').focus({preventScroll:true});return;}
    if(e.key==='Escape'&&worksOpen&&!$('picker-dialog').open){e.preventDefault();worksOpen=false;render();$('work-picker').focus({preventScroll:true});return;}
    if(e.key==='Escape'&&drawerOpen&&compact()&&!state.reader&&!$('picker-dialog').open){e.preventDefault();toggleSidebar();return;}
    if(!state.reader||$('picker-dialog').open)return;
    if(e.key==='Escape'){e.preventDefault();closeReader();return;}
    if(e.key==='Tab'&&$('reader').getAttribute('aria-modal')==='true'){
      const nodes=[...$('reader').querySelectorAll('button:not(:disabled),a[href],[tabindex="0"]')].filter(n=>n.getClientRects().length),first=nodes[0],last=nodes.at(-1);
      if((e.shiftKey&&document.activeElement===first)||(!e.shiftKey&&document.activeElement===last)||!$('reader').contains(document.activeElement)){e.preventDefault();(e.shiftKey?last:first)?.focus();}
    }
  });
  $('picker-dialog').addEventListener('close',()=>{if(opener?.isConnected&&!opener.closest('[inert]'))opener.focus({preventScroll:true});});
  $('sidebar').addEventListener('pointerover',e=>{if(e.pointerType!=='touch')queueTip(e.target.closest('[data-tip]'));});
  $('sidebar').addEventListener('pointerleave',hideTip);
  $('sidebar').addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]');if(el?.matches(':focus-visible'))queueTip(el,true);else hideTip();});
  $('sidebar').addEventListener('focusout',e=>{if(!$('sidebar').contains(e.relatedTarget))hideTip();});
  $('sidebar').addEventListener('pointerdown',hideTip);
  $('task-list').addEventListener('scroll',hideTip,{passive:true});
  requestAnimationFrame(()=>requestAnimationFrame(()=>$('noya').classList.add('sidebar-ready')));
  $('subtask-float-list').addEventListener('scroll',()=>{rememberFloating();save();},{passive:true});
  $('feed').addEventListener('scroll',()=>{rememberFeed();save();},{passive:true});
  $('reader-scroll').addEventListener('scroll',()=>{if(state.reader){task().readerPositions[state.reader]=$('reader-scroll').scrollTop;save();}},{passive:true});
  window.addEventListener('resize',()=>{closeFloating(true);render();});
  window.NoyaPrototype={pickWorks,pickTasks,toggleSidebar,toggleFloating,closeFloating,openSubtask,backSubtasks,processGroups:(agentId='main')=>processGroups(task(),agentId),newTask,closeDialog,submit,stopTask,continueTask,closeReader,openResult,render,getState:()=>state,reset:mode=>{closeFloating();state=initial(mode);lastScope=null;render();},advance:()=>{if(state.job)state.job.nextAt=0;tick(true);}};
  const favicon=document.createElement('link');favicon.rel='icon';favicon.href='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><text x="7" y="25" fill="#a33f32" font-family="Georgia" font-style="italic" font-size="26">N</text></svg>');document.head.append(favicon);
  render();if(state.reader)$('reader-scroll').scrollTop=task().readerPositions[state.reader]||0;
  setInterval(()=>tick(),600);
})();

</script>
