stage: 3
complexity: standard
review_mode: single
design_posture: incremental

requirements_summary: |
  作者在主信息流阅读 Main，每个 Sub 在自己的详情中展示完整可见执行过程，所有 Agent 内部使用相同展示规则。
  消息与保存结果直接可见，思考、工具明细和技术原内容默认收起，相邻思考与普通工具合并；用简短动作摘要，展开为平铺活动行。
  信息流里的 Sub 派发使用紧凑单行入口，输入框上方的子任务入口向上展开浮层，便于定位当前与历史子任务。
  各 Agent 的记录分别呈现，内容保留原名与原文，不按业务角色改写或隐藏；长内容可展开读全，未知工具或身份仍通用呈现。
  默认流不显示全部 Agent 或记录数工具栏；从浮层或派发入口打开 Sub 详情，主信息流保持原位置，输入仍发给 Main。
  本轮同步交付 PRD 和固定样例交互原型，暂不做使用统计。

confirmed_decisions:
  - 用户明确要求 Main 和 Sub 同样展示完整可见过程，参照 Codex 客户端。
  - 保留原工具名称、参数、全部已收到的输出、返回和错误，不按业务角色特异化处理。
  - 用户明确要求不同 Agent 的运行记录不混排；主信息流只显示 Main，各 Sub 在所选详情中显示自己的记录和结果，输入始终发给 Main。
  - 用户要求思考与工具默认收起，正在执行也不自动展开；相邻记录合并，展开后仍可读全。
  - 用户要求折叠摘要简洁，不强调执行过程；按最新图片使用简短动作摘要与平铺活动行，原工具名可达，保留运行与异常。
  - 活动数量与时长只依据实际记录，未知动作仍保留原工具名，不按 Agent 业务角色改写内容。
  - 用户认为逐条 Main 标识、轮次和时间无用；各处沿用所在视图的身份，执行归属与时间按需查看。
  - 用户要求 Sub 特化展示，派发入口与输入框上方浮层入口并存，内部过程仍通用。
  - 用户要求子任务浮层参照给定图片向上展开，可以收起，无页面遮罩，背景与输入仍可操作。
  - 用户追加详情参考图，在同一浮层内阅读 Sub 过程，先看 Main 派发的要求，再看通用过程，顶部返回列表或关闭。
  - 进度依据实际内容与事件，不用虚构百分比，执行结束不替代工作成功或作者决定。
  - 本轮交付 PRD 与可点击原型，启用单个独立文本审查者及设计验证。
  - 保留多任务与作品切换、停止与恢复的准确归属，暂不做使用统计。
  - 2026-10-06 信息流整体重做为成果优先：Sub 交回的成果与结论显示在 Main 信息流的派发卡上（属于 Main 派发调用的返回，不混入 Sub 过程）。
  - 2026-10-06 Sub 详情改为固定高度阅读面板（宽屏右侧、窄屏全屏），输入框上方浮层只做子任务列表。
  - 2026-10-06 子任务卡片标题用 Main 派发时写的一句任务说明，只给作者看、不交给 Sub；旧记录缺说明时显示身份并注明未写任务说明。
  - 2026-10-06 一轮里的子任务都结束、Main 不再等待时，Main 用一条回复说明结果与需要作者决定的事，写入 Main 的工作要求。

