discussion_draft: discussion.md

journey_summary: |
  作者在原任务向 Main 提出要求，主信息流直接显示 Main 已发生的过程，真实派发后加入对应 Sub 的入口。
  主信息流只展示 Main，每个 Sub 的详情只展示该 Sub；各 Agent 的消息、思考、调用、参数、输出、返回、错误和状态事件完整保留。
  思考与普通工具按同 Agent、同次执行的连续段合并，过程组和工具明细默认收起，技术原内容同样可展开。
  在各 Agent 自己的流中，消息、执行分界、保存结果或派发断开分组；其他 Agent 活动不打断本 Agent 的连续记录。
  连续内容沿用所在视图的身份，Sub 详情沿用顶部标题，记录轮次与时间按需查看。
  分组用简短动作摘要，展开后按顺序平铺工具与思考活动；数量与时长有依据，原工具名与完整内容可达，运行与异常可见。
  默认过程流直接显示内容，移除全部 Agent／记录数和顶部通用筛选工具栏。
  Sub 派发在信息流以紧凑单行显示名称与状态，输入框上方入口显示任务状态及进行中数量，向上展开当前与历史浮层。
  浮层列表显示任务、身份、状态、最近已记录动作与保存结果，不锁背景，点击输入框仍能输入。
  点行在同一浮层打开 Sub 详情，将实际派发与补充要求作为独立上下文，再显示该 Sub 完整过程与结果，独立滚动，主信息流不切换。
  再点入口、关闭、Escape、点外部均收起；详情返回列表，切换任务收起并保持各自输入与阅读位置。
  两处入口使用同一身份、真实任务描述、状态和结果，打开同一个 Sub 详情，不增执行控制。
  Main 和 Sub 使用相同通用内容规则，不按写手或检查员等角色改写过程，不认识的身份或工具仍可查看。
  同一消息和调用持续更新，参数及所有已收到输出可读，并行调用各自对应，完成不重排已有记录。
  从派发入口直接打开详情，或从输入区浮层列表进入；作者输入仍明确发给 Main。
  展开可读长内容全文与完整参数、输出；未提供或不可读的思考说明只说明事实，不补写。
  浮层中的保存结果只读打开，返回恢复该 Sub 详情、展开和阅读位置，业务结论与执行状态分别表达。
  隐藏期间的新记录仍保留，重新打开时补齐；阅读旧内容时新记录不抢位置，Main 的新记录提示仅对应 Main，Sub 更新只进入对应详情。
  切换任务或作品只看对应过程，实际执行任务保留返回入口，晚到内容始终归原任务，停止目标不变。
  刷新或重连补齐并合并内容，不重发要求，不重复记录，保留输入和查看位置。
  失败、停止、中断保留已收到过程及保存结果；重启只改未结束执行，历史结束结论不改写。
  已确认停止或中断时，未返回的工具标明结束原因与未收到最终返回，保留已有输出，不停留在运行中。
  同一 Agent 继续保留新执行分界，新 Agent 独立记录；旧过程缺失或单项不可用明确说明。
  功能模块为看完整过程、定位与阅读、离开与恢复。
  用户最新注释明确去掉顶部计数与筛选，输入区子任务浮层成为查看重点，按此更新同一需求包。

