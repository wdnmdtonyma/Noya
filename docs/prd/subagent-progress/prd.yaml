user_style_prefs:
  - 用用户视角的具体操作说明页面，少用抽象术语和层层标题。
  - 页面主体是 Agent 写作任务，正文只读，修改通过对话完成。
  - 先理清用户旅程再画页面，MVP 能力保持小。
  - 覆盖多部作品以及同一作品内多个任务的切换和恢复。
  - 已交付版本的增量另开文档，不改写旧规格掩盖范围变化。
  - Main 和 Sub 执行内容用相同规则完整显示，保留工具名称与原文，不按业务角色特异化处理。
  - 思考与工具过程默认收起，相邻记录合并；Sub 派发和定位专门展示，避免埋在信息流里找不到。
  - 去掉全部 Agent／记录数和顶部筛选，子任务入口放输入框上方，用可展开收起的浮层承载，参照用户提供的图片。
  - Sub 的详情也在同一浮层内展开，保留父任务要求、返回与关闭，主信息流留在背景。
  - 折叠摘要保持简洁，不重复强调执行过程或解释熟悉的内容，省去 thinking 条数、工具调用总数与常态结束提示。
  - 最新图片将摘要进一步明确为 Codex 式轻量动作概括与展开后的平铺活动行；箭头紧随摘要，不使用日志卡片层层套叠，原工具名和完整明细可继续读取。
  - 不要逐条重复 Main / main、轮次和时间；沿用所在视图的身份，Sub 详情沿用顶部标题，追溯信息按需查看。
  - 不同 Agent 的运行记录各自展示，主信息流只看 Main，Sub 从派发入口或输入区浮层进入；内部展示规则相同不等于混在同一条流。

