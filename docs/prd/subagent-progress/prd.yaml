discussion_draft: discussion.md

journey_summary: |
  信息流是作者与 Agent 协作的主入口，按"每次作者发言 → Main 这一轮处理"组织，成果优先。
  进行中的一轮完整展开，底部"正在处理 · 用时"；结束的一轮收为"已处理 X 秒"，只留子任务卡片和 Main 最后一条回复，可展开看全部。
  Main 文字直接可见；思考与工具成组折叠，摘要为"动作 + 对象"，不显示步数；常规开始/结束不显示，非常规事件保留。
  Main 派发或继续 Sub 时出现子任务卡片：Main 写的任务说明为标题，身份次要，统一状态词；进行中显示当前动作，结束后挂交回成果（可阅读）或一句话。
  成果是 Sub 交回给 Main 的返回，显示在 Main 卡片上；Sub 的过程只在自己的详情中。
  输入框上方子任务入口：单个进行中时直接显示当前动作；点开为列表浮层（仅列表、不遮罩、Esc/点外部收起）。
  从卡片或列表打开右侧固定高度详情面板（窄屏全屏）：派发要求全文 → 该次过程与成果 → 补充要求 → 下一次执行；原始调用按需展开。
  面板内打开成果在同位置只读阅读，"返回子任务"恢复原详情与位置；打开详情时输入框提示回复发给 Main。
  执行中输入为空时发送键变停止，输入后变回发送；另一任务执行时可输入暂不能发送并说明原因。
  切换任务关闭面板与列表，晚到内容归原任务，停止指向实际执行任务；刷新/重连补齐不重发、不重复。
  失败、停止、中断如实写在卡片与调用上，已交回成果仍可读；未返回调用标"未收到最终返回"；重启把未结束执行标中断。
  Main 与 Sub 过程规则相同，保留原工具名与原文，不按业务角色改写；不认识的工具或内容通用展示。
  功能模块：发起与跟进、成果透出、子任务详情、离开与恢复。
