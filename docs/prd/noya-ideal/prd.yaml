archive_note: |
  “Noya · 理想方案”涉及世界模型、长篇写作状态、一致性守护、自然语言交互与可视化世界演进，当前整体复杂度过高，暂不进入开发。
  现有文档、交互原型和素材作为阶段性探索成果存档；后续若恢复，需先收缩范围并拆成可独立验证的小版本，不直接按本 PRD 实施。
stage: 2
complexity: heavy
review_mode: multi

journey_summary: |
  【v2 · 2026-07-22 现行 · 世界沙盒模型（三 reviewer 审过，20 条已并入）】
  三条公理：①一个门——任何时刻用户只能做一件事：在底部框里说一句话或贴一段正文，没有菜单/tab/导航；②世界会长——每次交互后地图（雾退开/新地点/新人物）、时间线、册子、字数可见地变；③世界会挡——Agent 有世界记忆，说的话跟已定事实冲突时先拦一句讲代价，高代价动作（打回/动设定根/丢书）执行前复述确认。功能发现由 Agent 承担：每次收尾留一个问题＋框下 2-3 个快捷说法。
  主线：空手打开（Agent 先问"想写点什么"）→ 三颗书种（带市场理由；可无限重出／带反馈重炼／自带想法直接贴／熟手直建；创世途中可喊停退回选种）→ 创世（世界从雾里长出来）→ 开局三章（每章：Agent 提议 → 你点头或改 → 写 → 世界长）→ 三章关口（Agent 主动问"这个开局要不要"，不要则回炉大纲／换书种）→ 日常循环（Agent 提议这一章→你点头或改→写一章→世界长→Agent 留问题；永远一章一拍，无连写档）→ 卷末校准（盘未还的账）→ 镜头拉远、地图长出下一层（宗门→州→大陆）→ 完结（盘账→收尾方案→写完）→ 导出；番外写完回主线并问事实是否入世界，"我还想接着写"可把书退回连载态（弃掉的账可捡回）。
  Agent 每次提议一章＝章卡四件（内容不变，只是从卡片变成一段话）：大致剧情含"看点怎么演"到机关/反转的程度 ｜ 登场角色一句话介绍＋长期/一次性标注（事先亮出、可换成现成角色）｜ 在场与知情（谁知道什么秘密）｜ 章末钩。
  改的四档：调文风（往后所有章的写法，事实不动，历史章可选重润）／润色单句（触到已入库事实时提示转打回）／打回重写（先讲代价→确认→按章快照回滚；你自己写进去的内容单拎出来、默认不跟着滚）／动设定的根（给影响范围；默认从当前章起改、不回改历史，矛盾章节列清单可逐条接受或打回；坚持全书回改为兜底）。
  防跑偏：顶你一下（冲突时拦一句讲利害并给出路）＋ 欠账常亮（伏笔/承诺多少章没还）＋ 卷末校准 ＋ 一致性守护（在场知情查表、写完自检、叙事纪律：系统词不许掉进叙事层）。冲突一律当场停下问（无巡航，故不再分级）。
  一个框的两种语义：疑问句只答不写（答完明说"这个我只是查了，世界没动"）；贴长文先反问一句"这是正文还是给我参考的资料"。写作期间框照常能说话，新话当"下一章的补充"排队；说"停"停在最近一个完整章、扔掉写一半的那章并交代账。Agent 列出的任何清单（吸收结果/矛盾章节）都可逐条对着说话改判。
  世界的可见面：地图（三层：世界大图／地点场景／秘境独立作用域；随卷长大）＋ 时间线（超长收省略号）＋ 册子（人物含关系远近、大事记、两本账；字段随题材变）＋ 主角面板（点主角开：属性/背包/系统任务；面板是只给主角和读者的一层，NPC 看不见，这条同时喂给防穿帮）。
  安全网：任何改动世界的动作留一步反悔位（有效到下次改动为止）；用户自己标记为"已发出去"的章是回滚硬底（只能往后打补丁或从最新章起改；坚持改则放行并记一笔账。本方案不代发，此状态由用户自报）；归档角色再出场或撞名先问、不静默新建第二份；世界/书可丢弃重来但先算代价；冷启动默认落回上次那本并顺带报其它书状态，随时可说"我有哪些书"。
  三条已拍板（2026-07-22 用户："先不做发布这些能力，也不做巡航和双线，先把单线理清楚"）：①发布——本方案不做，只到成稿＋导出，用户自己去平台发；"已发布"退化为用户自己标的一个状态，仅用来锁回滚；②巡航——不做，永远一章一拍。连带砍掉：冲突分级（小冲突记账续跑卷末过账）不再需要，每章都在用户眼前写、有冲突当场问；跨书巡航不打断、完成通知一并取消；③分叉时间线——不做，单线；重生流的前世线用回忆承担。
  功能模块（本方案十一项）：会长的世界（地图/时间线/迷雾）｜ 对话入口（说话/贴正文/快捷说法/Agent 主动开口）｜ 提议与写作（章卡四件＋逐章回写，一章一拍）｜ 吸收（读你写的正文并入世界，冲突当场裁决）｜ 世界记忆与守护（在场知情/叙事纪律/顶你一下）｜ 剪枝（按章快照/一步反悔位/自标已发布则锁回滚）｜ 两本账（欠读者的＋主角系统任务）｜ 创世（书种＋开局三章关口）｜ 册子与主角面板 ｜ 正文阅读与导出 ｜ 书架多本
  设计原则（更新）：一份世界状态两个消费者 / 展示做重编辑做轻 / 人拍板剧情 Agent 拍板文字（默认等点头）/ 章为事务 / 先市场后创作（市场判断由 Agent 口播承担）/ 题材化 / 一个门——不靠加界面解决问题，任何新需求先问"用户会怎么说这句话"

  【v1 表达层，已被 v2 取代；下列内容结论仍然有效，只是不再以界面/菜单的形式出现】
  主线：空书架开新书（三档入口：完整流程/自带想法/熟手直建）→ 热点雷达（题材×标签两层，热度×拥挤度，基本盘+新势头）→ 融合工坊梯度选题卡（全不满意可重出/带反馈重算/退回雷达）→ 拍板立项 → 大纲=建世界（世界观卡/角色卡/写作风格卡+世界地图+分卷时间轴，改动联动波及提示）→ 黄金三章试写（三级返工：调风格卡重写/回炉大纲/换选题卡，熟手直建档就地拉融合工坊补卡；"接受"时按章回写世界状态）→ 正写循环（副本单元决策点→章纲→逐章正文→回写世界状态+一致性自检；默认决策点等人，可开自动巡航到卷末）→ 卷间校准（卷复盘+小冲突账过账）→ 完结检查（未回收伏笔逐条：回收/弃用/忽略）→ 导出 → 书架多本并行；已完结可追加番外/续写
  功能模块：书架 / 热点雷达 / 融合工坊 / 大纲建世界（五件套：世界观卡/写作风格卡/角色卡组/地图初版/分卷时间轴）/ 黄金三章试写 / 正写循环（巡航、按章快照回滚、卷间校准、提前完结）/ 书内空间（两层信息架构，见下）/ 一致性守护（冲突分级+三选项裁决）/ 稿件库与导出（章带草稿/定稿/已发布状态，已发布水位线保护回滚）
  信息架构（用户确认的"两层模型"）：进书落总览（此刻旁白+卷进度+正在写的任务+世界观入口+最近章节）；书内导航分两组——世界观·影响内容（大纲/地图/关系网/人物/怪物）是"因"，产物·给读者的（章节/写作任务）是"果"；写作任务显式列出消费的世界观上下文与产出章节，章节阅读页带定稿回写条与改稿入口（润色事实比对/打回重写，已发布章节水位线锁定）；决策点/巡航/导演指令住在地图页，伏笔账本与大事记为地图抽屉；怪物为题材化非人实体类型（规则怪谈体/妖兽等随题材改名）；人物卡含档案+故事线
  进书简报模型（2026-07-13 用户确认）：进书/落子屏＝一份“从故事读到棋子”的分层战情简报，读完即可指挥——①剧情回顾（叙事：前情→此刻，快速进入状态）→②登场阵容（题材化角色属性卡：规则怪谈＝身份/威胁度/掌握规则/正邪未明，仙侠＝境界/法宝/功法/等级/正反派；当前状态标在卡上）→③副本档案（危险度/世界地图坐标/大纲位置/量级）→④目的与结局（各登场角色在本副本的目的＋预定结局，用人物命运表达剧情走向，而非六行章纲）→落子（顺简报拍板/微调，章纲编辑退为抽屉）。可补资产：装备道具库存 / 技能·规则清单 / 势力阵营图 / 未回收伏笔＝未结目标
  章卡与任务账（2026-07-20 用户确认）：分段出计划（段＝副本单元，带起点/终点，每章一卡）；章卡四件＝大致剧情含“看点怎么演”（写到机关/反转的程度，不许只贴“此处有爽点”标签）｜登场角色＋一句话介绍＋长期/一次性标注（新造角色事先亮出、可否掉换现成的）｜在场与知情（谁知道什么秘密，防穿帮）｜章末钩；点头后逐章写、逐章回写世界（时间线/新角色入库/面板背包更新），核心角色卡开书即建、过程新人随章入库。任务系统＝未结之事一本账两面：主角面＝系统任务（书内事实），作者面＝欠读者的伏笔与承诺的戏；防偏离＝欠账常亮。写作摩擦 C（爽点无弹药）/D（POV 与暗线）由“看点演法”“在场知情”两栏收掉
  关键分支决策：
    - 人当导演 Agent 当写手；决策单位=副本单元（约5-15章）；平台口径=番茄/七猫系免费平台；先市场后创作
    - 巡航冲突分级：小冲突记账续跑（卷末过账+战情室可查），大冲突暂停叫人；裁决三选项：接受为新事实/按原设定重写/手动改
    - 改稿边界：润色直接改（保存时轻量事实比对，命中已入库事实提示转打回）；动剧情事实=打回单元重写+世界状态回滚（按章快照）
    - 中途改世界设定：从当前章按新设定走、不回改历史章，矛盾章节列清单供选择接受/打回
    - 跨书：巡航为后台任务，切书不打断；同时仅一本书巡航[假设]；完成/暂停有全局提醒
    - 提前完结随时可发起：剩余主线压缩成 N 章收尾，照常完结检查后导出
    - 战情室态势感知优先、修改一律走对话；规模降载=默认聚焦当前卷+活跃实体，关系网按与主角距离分层
  设计原则：一份世界状态两个消费者 / 展示做重编辑做轻 / 人拍板剧情 Agent 拍板文字 / 章为事务 / 先市场后创作 / 题材化（一份世界状态按题材长出不同卡面与字段）

user_style_prefs:
  - 说人话、别像念 PPT/咨询报告：短句，一次说一个点
  - 少堆加粗、表格、层层标题；先用一句平白的话给结论，再展开
  - 别堆压缩术语和一串括号补充说明，读着费劲
  - 不要自造词（"倒世界"这类一眼看不懂的说法）；描述产品时用用户视角的具体说法，不用抽象的数据模型词汇（实体/透镜/派生视图只留在内部文档）
  - 接续/汇报时别把项目黑话连着堆（落子/料单/戏眼/收口一句里出现好几个直接看不懂）；用具体例子把事讲清楚，一次只抛一个议题
  - 界面信息密度要克制：一屏一个焦点动作；角色/账目等细节收进 hover/点开的层级，不平铺全字段（“信息量爆炸，看着难受”）

