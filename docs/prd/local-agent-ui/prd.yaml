schema_version: 1

feature: Noya 本地 Agent 任务界面
slug: local-agent-ui
created: 2026-10-04
updated: 2026-10-04

status: draft
stage: 2
complexity: standard
design_posture: restructure
# 保留 v0 的业务流程；页面结构按用户认可的六段旅程收敛，视觉变量沿用。
# review_mode 尚未选择，不把旧 PRD 的审查授权自动移到本包。

requirements_summary: |
  作者已跑通 Noya v0，并接入 OpenAI 能力，但命令行不方便日常写作。
  本轮为现有能力提供本机启动、浏览器使用的 Agent 任务界面，先服务作者本人，再给少量作者试用。
  用户通过任务对话提出要求、观察执行过程、查看产物，并由 Agent 完成修改；作者仍负责确认与定稿。
  作品和任务记录保存在本机。首版按现有运行方式推进，不增加多个作者任务同时执行的能力。

confirmed_decisions:
  - 用户本人是第一位使用者，随后供少量作者试用。
  - 核心问题是命令行不方便，需要简单的页面承接已有能力。
  - 页面以 Agent 任务为中心；正文作为只读产物，修改通过 Agent 完成。
  - 本机启动并在浏览器中使用，统一托管的 Web 服务留待以后。
  - 首版按 v0 现有能力设计，不扩展多个作者任务并行。
  - 用户旅程必须覆盖同一作者拥有多部作品，包含进入、新建、切换和回来继续。
  - 用户已认可按四个 Agent 职能拆解的六段旅程，并要求据此走查现有能力、优化设计稿。
  - 用户已确认收敛后的可点击设计稿足以作为 MVP；当前页面与六段旅程共同作为后续实现的设计基线。

source_baseline: capability-baseline.md
discussion_draft: discussion.md

journey_summary: |
  用户已认可六段旅程及收敛后的可点击设计稿，现有能力走查已完成，MVP 设计基线已确认。
  入口覆盖无作品、单作品、多作品；默认恢复上次作品，允许选择已有作品或新建作品。
  每部作品分别保留任务、资料和产物；进入作品后，在最近任务或空白起点自由描述想法，不先填写开书表单。
  切换只改变查看内容，不自动取消或启动任务；原任务仍在执行时可查看另一作品，待原任务结束或明确停止后才能在另一作品执行。
  讨论继续作为讨论；作者明确要求写作后，Agent 按现有流程准备、写作、检查与交稿。
  时序图按作品入口、讨论准备、方案与正文检查、作者返修、定稿同步、作品切换与恢复六段展示，并拆出 Context、Writer、Reviewer、Sync Checker 的职责。
  章节方案由 Agent 检查，无问题后自动推进，不增加作者逐章审批方案的必经步骤。
  作者打开完整初稿，在同一任务中反馈修改，再读新稿，最后明确决定是否定稿。
  Context 负责整理和应用资料变更，Sync Checker 只核对；正常变化自动应用，冲突交作者决定，失败保持正文已定稿和资料待同步两个状态。
  下次打开恢复上次作品及其最近任务；失败、停止和中断保留已保存内容，并说明如何继续。
  页面只围绕顶部作品切换、最近任务对话与按需打开的正文阅读设计。执行记录展示不同角色的分工，确认与冲突在对话中解决。

canvas:
  enabled: true
  consent_scope: [server, design-token-subagent]
  preview_url: http://localhost:54852/p/01-tasks
  status: approved
  data_mode: fixed-demo
  pages: |
    01-tasks：顶部切换与新建作品，最近任务对话、可展开的角色执行记录、正文阅读、修改、指定版本定稿与资料同步。
    资料确认、方向调整、同步冲突、失败和停止在同一任务中处理；旧版的管理侧栏、目录、盲比、审计和模型设置已移除。

user_style_prefs:
  - 用用户视角的具体操作说明页面，少用抽象术语和层层标题。
  - 先讨论文字设计，再制作原型。
  - 页面主体是 Agent 任务，不以正文编辑器作为产品中心。
  - 按现有能力设计，必要的页面适配与新的写作能力要分清。
  - 需要看到并操作页面，才能确认手感与能力；文字结论不能代替页面体验。
  - 先理清用户旅程再画页面；现有能力是设计依据，不等于 MVP 必须全部展示。
  - MVP 能力可以少，避免为完整感增加管理页、工具入口和作者操作步骤。
  - 用户旅程须覆盖拥有多部作品和切换作品的情况，不能只描述单部作品内的一次写作。
  - 时序图按阶段细拆，展示承担不同职能的 Agent 之间的交接，不能全部合并成 Noya 一条泳道。

iterations:
  - date: 2026-10-04
    summary: 根据本轮对话记录首版范围，核对 v0 现有能力，整理任务页面与用户路径的讨论稿。
    trigger: 用户确认本机使用、任务为中心，并要求按现有能力设计
  - date: 2026-10-04
    summary: 用户确认页面方向并要求先体验；制作本地可点击原型，复用既有视觉变量，以固定样稿覆盖主要流程与异常状态。
    trigger: 用户要求看到页面以确认手感和能力
  - date: 2026-10-04
    summary: 用户指出原型明显多做，要求回到用户旅程。停止页面扩展，收缩到一次写作任务的讨论、执行、交稿、修改、定稿与恢复；核对现有写作流程，移除作者必须先审批章节方案的错误假设。旧原型标记为待旅程重定。
    trigger: 用户纠正 MVP 范围过大
  - date: 2026-10-04
    summary: 用户指出时序图遗漏多作品；补充无作品、单作品、多作品入口，以及新建、切换、执行中切换和按作品恢复的旅程建议。保持原型冻结，未增加页面实现。
    trigger: 用户要求补全多作品用户旅程
  - date: 2026-10-04
    summary: 按当前四个角色的提示词和写章、同步流程重新核对职责，将旅程拆为六段时序图，补清方案审核、正文检查与有限返修、作者修改、同步核对和多作品运行状态。只更新讨论文档，未增加产品能力。
    trigger: 用户要求细拆时序图并展示不同 Agent 的职能
  - date: 2026-10-04
    summary: 用户认可旅程后，逐段核对代码与提示词并记录能力缺口；将原型收敛为作品切换、任务对话与按需阅读，修正自动方案审核、讨论入口、跨作品状态和定稿同步流程。浏览器验证覆盖正常写作、同步分歧与恢复、多作品、指定旧稿定稿和窄屏阅读，记录于 design-validation.md。
    trigger: 用户要求按认可的旅程走查能力并优化设计稿
  - date: 2026-10-04
    summary: 用户确认当前设计稿作为 MVP 已足够；记录页面与六段旅程为已确认设计基线。真实页面接入与执行验收尚未开始。
    trigger: 用户反馈“感觉可以，作为 mvp 可以了”

