schema_version: 1
feature: 写作任务新建与切换
slug: writing-tasks
created: 2026-10-04
updated: 2026-10-04
status: review
stage: 3
complexity: standard
review_mode: single
design_posture: incremental

requirements_summary: |
  本地 Agent 任务界面已开发，作者发现同一作品内无法新建写作任务。
  本轮另开增量 PRD 与工程规格，补齐新建独立任务、选择旧任务、继续工作及精确恢复。
  新任务共享作品正式资料，不自动继承旧任务的临时对话与未定稿内容。
  保留本机使用、单作者任务执行及现有页面结构；先交付文档，启用单个独立审查者。

confirmed_decisions:
  - 新建独立 PRD 和 spec，保留已交付的 local-agent-ui 规格与实现基线。
  - 范围包含同一作品内新建任务，以及切回旧任务查看和继续。
  - 同一时刻只执行一个作者任务，运行中允许查看新任务或其他任务。
  - 使用轻量任务切换入口，沿用现有任务空间和只读正文阅读。
  - 本轮先交付 PRD 与 spec，启用单个独立审查者。

canvas:
  enabled: false

tracking:
  needed: false
  questions: []
  basis: 延续上一版已确认规格中不纳入使用统计的范围；本轮已询问额外度量需求，未收到新增要求。

journey_summary: |
  作者在当前作品的任务入口新建任务，保存成功后进入独立空白讨论。
  新任务共享当前正式资料，不自动继承旧对话、废案、未定稿正文和作者确认。
  任务入口可选择已有任务，恢复其记录、稿件、输入与阅读位置，继续原目标。
  查看任务与执行任务分开，运行中仍可新建和查看另一任务。
  同作品和跨作品都遵守一个活动作者任务；返回及停止明确指向真正活动任务。
  等待决定但没有执行时可以做其他任务，旧决定保留并在应用前校验是否过期。
  待同步是作品级事实，安排写手生成或重写前先回对应同步任务处理。
  无可验证归属的健康旧数据可由作者明确承接，随后持续关联到承接任务。
  替换定稿使旧清单与决定失效，新定稿任务负责当前版本的同步。
  页面重开恢复所选具体任务；程序重启按真实执行记录和有效同步归属处理。
  已有任务兼容读取，旧版界面偏好只迁移一次；损坏任务不阻断其他正常任务。
  本轮先交付 PRD 和 spec，使用单个独立审查者，文档状态为待评审。

user_style_prefs:
  - 用用户视角的具体操作说明页面，少用抽象术语和层层标题。
  - 页面主体是 Agent 任务，正文只读，修改通过对话完成。
  - MVP 范围保持小，不为完整感增加管理页和工具入口。
  - 用户旅程须覆盖多部作品，以及同一作品内的多个任务。
  - 时序图按关键阶段拆分，Agent 只在真实参与时出现。
  - 已交付版本的遗漏另开增量文档，不改写旧规格来掩盖范围变化。

iterations:
  - date: 2026-10-04
    summary: 用户确认新建与切回旧任务继续的增量范围；建立独立需求包，先产出文档并启用单个审查者。
    trigger: 上一版本开发后发现缺少同一作品内的新建任务能力
  - date: 2026-10-04
    summary: 核对已实现代码并完成旅程审查，采纳同步归属、重写门禁及任务检索隔离意见；生成 PRD 初稿快照与独立 spec，进入文档评审。
    trigger: 按已确认范围完成增量设计
  - date: 2026-10-04
    summary: 单审查者确认 PRD 路径完整，指出 spec 的同步归属须落实到工具写入门禁；补充校验与验收，并核对旧偏好迁移和失效任务选择。
    trigger: 成稿独立审查

open_questions:
  - id: journey
    text: 新建独立任务及返回旧任务继续的范围
    type: 待确认
    status: resolved
    resolution: 用户以 ok 确认主线、文档优先和单审查者；详细恢复与同步分支经代码核对和独立审查补齐，成稿交用户评审。
  - id: tracking
    text: 是否在原有 MVP 范围之外新增使用统计
    type: 待确认
    status: pending
    resolution: 可选补充问题；当前交付沿用原规格不做使用统计，不将未答复记作本轮明确否决。
